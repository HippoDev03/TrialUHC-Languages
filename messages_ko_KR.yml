    "scenario":
      "random":
        "name": "<bold><#f4d35e>Random"
        "desc": "<#6b7280><i>경기 시작 시 무작위 시나리오 조합이 선택됩니다.</i>"
      "chest":
        "name": "<bold><#f4d35e>Chest"
        "desc": "<#6b7280><i>플레이어를 처치하면 전리품이 사망 위치의 상자에 담깁니다.</i>"
      "time-bomb":
        "name": "<bold><#f4d35e>Time Bomb"
        "desc": "<#6b7280><i>플레이어를 처치하면 전리품이 상자에 담기고, 정해진 시간 후 폭발합니다.</i>"
      "safe-loot":
        "name": "<bold><#f4d35e>Safe Loot"
        "desc": "<#6b7280><i>Time Bomb이 켜져 있을 때, 처치한 플레이어만 상자를 열 수 있습니다.</i>"
      "no-clean":
        "name": "<bold><#f4d35e>No Clean"
        "desc": "<#6b7280><i>플레이어를 처치하면 정해진 시간 동안 무적이 됩니다.</i>"
      "golden-retriever":
        "name": "<bold><#f4d35e>Golden Retriever"
        "desc": "<#6b7280><i>플레이어가 죽으면 황금 머리 1개를 떨어뜨립니다.</i>"
      "bleedingsweets":
        "name": "<bold><#f4d35e>Bleeding Sweets"
        "desc": "<#6b7280><i>플레이어가 죽으면 다이아몬드 1개, 금 5개, 화살 16개, 실 1개를 떨어뜨립니다.</i>"
      "bookception":
        "name": "<bold><#f4d35e>Bookception"
        "desc": "<#6b7280><i>플레이어가 죽으면 사망 위치에 무작위 마법이 부여된 책이 나타납니다.</i>"
      "zombies":
        "name": "<bold><#f4d35e>Zombies"
        "desc": "<#6b7280><i>플레이어가 죽으면 사망 위치에 좀비가 생성됩니다.</i>"
      "betazombies":
        "name": "<bold><#f4d35e>BetaZombies"
        "desc": "<#6b7280><i>좀비를 처치하면 깃털을 떨어뜨립니다. (ZOMBIES 필요)</i>"
      "double-ores":
        "name": "<bold><#f4d35e>Double Ores"
        "desc": "<#6b7280><i>모든 광석이 평소의 2배를 떨어뜨립니다.</i>"
      "triple-ores":
        "name": "<bold><#f4d35e>Triple Ores"
        "desc": "<#6b7280><i>모든 광석이 평소의 3배를 떨어뜨립니다.</i>"
      "double-or-nothing":
        "name": "<bold><#f4d35e>Double or Nothing"
        "desc": "<#6b7280><i>철, 금, 다이아몬드 광석을 캘 때 50% 확률로 2배 또는 0개가 나옵니다.</i>"
      "blood-diamonds":
        "name": "<bold><#f4d35e>Blood Diamonds"
        "desc": "<#6b7280><i>다이아몬드 광석을 캐면 하트 반 칸을 잃습니다.</i>"
      "blood-gold":
        "name": "<bold><#f4d35e>Blood Gold"
        "desc": "<#6b7280><i>금 광석을 캐면 하트 반 칸을 잃습니다.</i>"
      "broadcaster":
        "name": "<bold><#f4d35e>Broadcaster"
        "desc": "<#6b7280><i>금이나 다이아몬드를 캐면 일정 확률로 좌표가 공개되고 발광합니다.</i>"
      "limitations":
        "name": "<bold><#f4d35e>Limitations"
        "desc": "<#6b7280><i>플레이어마다 캘 수 있는 다이아몬드, 금, 철의 수가 제한됩니다.</i>"
      "diamond-less":
        "name": "<bold><#f4d35e>Diamond Less"
        "desc": "<#6b7280><i>다이아몬드를 캘 수 없습니다. 대신 플레이어를 처치하면 다이아몬드 1개를 얻습니다.</i>"
      "gold-less":
        "name": "<bold><#f4d35e>Gold Less"
        "desc": "<#6b7280><i>금을 캘 수 없습니다. 대신 플레이어를 처치하면 금 주괴 1개를 얻습니다.</i>"
      "iron-less":
        "name": "<bold><#f4d35e>Iron Less"
        "desc": "<#6b7280><i>철을 캘 수 없습니다. 대신 플레이어를 처치하면 철 주괴 8개를 얻습니다.</i>"
      "woodlife":
        "name": "<bold><#f4d35e>Woodlife"
        "desc": "<#6b7280><i>석탄이 비활성화됩니다.</i>"
      "nodiamondarmor":
        "name": "<bold><#f4d35e>No Diamond Armor"
        "desc": "<#6b7280><i>다이아몬드 갑옷을 만들 수 없습니다.</i>"
      "no-enchant":
        "name": "<bold><#f4d35e>No Enchant"
        "desc": "<#6b7280><i>마법 부여대와 모루가 비활성화됩니다.</i>"
      "bare-bones":
        "name": "<bold><#f4d35e>Bare Bones"
        "desc": "<#6b7280><i>마법 부여와 모루 사용 불가. 황금 사과 제작 불가. 플레이어가 죽으면 다이아몬드 1개, 황금 사과 2개, 화살 32개, 실 2개를 떨어뜨립니다.</i>"
      "limited-enchants":
        "name": "<bold><#f4d35e>Limited Enchants"
        "desc": "<#6b7280><i>마법 부여대를 만들 수 없습니다. 0,0과 각 사분면 모서리(±500)에 미리 놓인 마법 부여대가 있습니다.</i>"
      "infinite-enchant":
        "name": "<bold><#f4d35e>Infinite Enchant"
        "desc": "<#6b7280><i>무한 마법 부여. 마법 부여대, 모루, 책장, 30k XP를 가지고 시작합니다.</i>"
      "blood-enchants":
        "name": "<bold><#f4d35e>Blood Enchants"
        "desc": "<#6b7280><i>마법 부여에 쓴 레벨 하나마다 하트 반 칸을 잃습니다.</i>"
      "better-enchant":
        "name": "<bold><#f4d35e>Better Enchant"
        "desc": "<#6b7280><i>모루에서 마법이 부여된 책을 쓰면, 아이템에 적용된 마법은 책에서 사라집니다. 모든 마법을 다 쓰면 일반 책이 됩니다.</i>"
      "limitedp4":
        "name": "<bold><#f4d35e>Limited P4"
        "desc": "<#6b7280><i>보호 IV는 아이템 하나에만 부여할 수 있습니다.</i>"
      "exposure":
        "name": "<bold><#f4d35e>Exposure"
        "desc": "<#6b7280><i>마법 부여대를 만들면 1분간 채굴 피로를 받고 지상으로 이동됩니다.</i>"
      "hidden-enchant":
        "name": "<bold><#f4d35e>Hidden Enchant"
        "desc": "<#6b7280><i>마법 부여대가 마법 이름을 보여주지 않습니다 — 눈을 감고 부여하세요.</i>"
      "grindstone-less":
        "name": "<bold><#f4d35e>Grindstone Less"
        "desc": "<#6b7280><i>숫돌이 비활성화됩니다. 마법을 제거할 수 없습니다.</i>"
      "blood-grindstone":
        "name": "<bold><#f4d35e>Blood Grindstone"
        "desc": "<#6b7280><i>숫돌로 제거한 마법 레벨 하나마다 하트 반 칸을 잃습니다.</i>"
      "hastey-boys":
        "name": "<bold><#f4d35e>Hastey Boys"
        "desc": "<#6b7280><i>만든 채굴 도구에 효율 III이 붙습니다. 숫돌로 효율을 제거할 수 없습니다.</i>"
      "hastey-boys-lite":
        "name": "<bold><#f4d35e>Hastey Boys Lite"
        "desc": "<#6b7280><i>만든 채굴 도구에 효율 I이 붙습니다. 숫돌로 효율을 제거할 수 없습니다.</i>"
      "op-hastey-boys":
        "name": "<bold><#f4d35e>OP Hastey Boys"
        "desc": "<#6b7280><i>만든 채굴 도구에 효율 V가 붙습니다. 숫돌로 효율을 제거할 수 없습니다.</i>"
      "carrotcombo":
        "name": "<bold><#f4d35e>Carrot Combo"
        "desc": "<#6b7280><i>검을 만들면 마법이 부여된 당근도 함께 나옵니다.</i>"
      "bow-nerf":
        "name": "<bold><#f4d35e>Bow Nerf"
        "desc": "<#6b7280><i>화살 피해가 50% 줄어듭니다.</i>"
      "rod-less":
        "name": "<bold><#f4d35e>Rod Less"
        "desc": "<#6b7280><i>낚싯대가 비활성화됩니다.</i>"
      "bow-less":
        "name": "<bold><#f4d35e>Bow Less"
        "desc": "<#6b7280><i>활이 비활성화됩니다.</i>"
      "sword-less":
        "name": "<bold><#f4d35e>Sword Less"
        "desc": "<#6b7280><i>검이 비활성화됩니다.</i>"
      "horse-less":
        "name": "<bold><#f4d35e>Horse Less"
        "desc": "<#6b7280><i>말과 당나귀를 길들일 수 없습니다.</i>"
      "fast-obsidian":
        "name": "<bold><#f4d35e>Fast Obsidian"
        "desc": "<#6b7280><i>흑요석이 돌만큼 빨리 부서집니다.</i>"
      "double-exp":
        "name": "<bold><#f4d35e>Double EXP"
        "desc": "<#6b7280><i>얻는 경험치가 모두 2배가 됩니다.</i>"
      "triple-exp":
        "name": "<bold><#f4d35e>Triple EXP"
        "desc": "<#6b7280><i>얻는 경험치가 모두 3배가 됩니다.</i>"
      "double-drops":
        "name": "<bold><#f4d35e>Double Drops"
        "desc": "<#6b7280><i>동물과 몹의 드롭이 2배가 됩니다.</i>"
      "triple-drops":
        "name": "<bold><#f4d35e>Triple Drops"
        "desc": "<#6b7280><i>동물과 몹의 드롭이 3배가 됩니다.</i>"
      "cut-clean":
        "name": "<bold><#f4d35e>Cut Clean"
        "desc": "<#6b7280><i>모든 원석과 날고기가 떨어질 때 자동으로 제련됩니다.</i>"
      "lucky-leaves":
        "name": "<bold><#f4d35e>Lucky Leaves"
        "desc": "<#6b7280><i>나뭇잎을 부수거나 사라질 때 설정된 확률로 황금 사과가 떨어집니다.</i>"
      "tree-drops":
        "name": "<bold><#f4d35e>Tree Drops"
        "desc": "<#6b7280><i>나뭇잎을 부수거나 사라질 때 금(0.5%), 다이아몬드(0.1%), 깃털(10%)이 떨어질 수 있습니다.</i>"
      "flower-power":
        "name": "<bold><#f4d35e>Flower Power"
        "desc": "<#6b7280><i>꽃을 부수면 무작위 아이템이 떨어집니다.</i>"
      "timber":
        "name": "<bold><#f4d35e>Timber"
        "desc": "<#6b7280><i>원목 하나를 부수면 연결된 나무 전체가 베어집니다 (최대 256개).</i>"
      "veinminer":
        "name": "<bold><#f4d35e>Vein Miner"
        "desc": "<#6b7280><i>웅크린 채 광석을 캐면 연결된 같은 광석이 모두 부서집니다.</i>"
      "baldchicken":
        "name": "<bold><#f4d35e>Bald Chicken"
        "desc": "<#6b7280><i>닭이 깃털을 떨어뜨리지 않습니다. 스켈레톤은 화살 3-5개를 떨어뜨립니다.</i>"
      "bats":
        "name": "<bold><#f4d35e>Bats"
        "desc": "<#6b7280><i>박쥐를 처치하면 95% 확률로 황금 사과, 5% 확률로 사망합니다.</i>"
      "no-fall-damage":
        "name": "<bold><#f4d35e>No Fall Damage"
        "desc": "<#6b7280><i>낙하 피해를 받지 않습니다.</i>"
      "fire-less":
        "name": "<bold><#f4d35e>Fire Less"
        "desc": "<#6b7280><i>불과 화상 피해를 받지 않습니다.</i>"
      "absorptionless":
        "name": "<bold><#f4d35e>Absorptionless"
        "desc": "<#6b7280><i>흡수 하트가 없습니다 - 황금 사과와 머리는 회복만 합니다.</i>"
      "double-health":
        "name": "<bold><#f4d35e>Double Health"
        "desc": "<#6b7280><i>모든 플레이어의 하트가 10개 대신 20개입니다.</i>"
      "night-vision":
        "name": "<bold><#f4d35e>Night Vision"
        "desc": "<#6b7280><i>모든 플레이어가 영구 야간 투시를 가지고 시작합니다.</i>"
      "invisibility-protection":
        "name": "<bold><#f4d35e>Invisibility Protection"
        "desc": "<#6b7280><i>게임 시작 시 모든 플레이어가 5분간 투명화를 받습니다.</i>"
      "birds":
        "name": "<bold><#f4d35e>Birds"
        "desc": "<#6b7280><i>모든 플레이어가 날 수 있습니다.</i>"
      "noodlejump":
        "name": "<bold><#f4d35e>Noodle Jump"
        "desc": "<#6b7280><i>게임 시작 시 모든 플레이어가 영구 점프 강화를 받습니다.</i>"
      "superheros":
        "name": "<bold><#f4d35e>Superheroes"
        "desc": "<#6b7280><i>플레이어마다 무작위 특수 능력을 받습니다. 낙하 피해 없음.</i>"
      "everyrose":
        "name": "<bold><#f4d35e>Every Rose"
        "desc": "<#6b7280><i>게임 시작 시 가시 III이 부여된 황금 흉갑을 받습니다.</i>"
      "pyro":
        "name": "<bold><#f4d35e>Pyro"
        "desc": "<#6b7280><i>화염 I과 발화 I이 부여된 책을 가지고 시작합니다.</i>"
      "criple":
        "name": "<bold><#f4d35e>Criple"
        "desc": "<#6b7280><i>낙하 피해를 받으면 30초간 구속 효과를 받습니다.</i>"
      "sky-high":
        "name": "<bold><#f4d35e>Sky High"
        "desc": "<#6b7280><i>설정된 Y 높이 아래에 있으면 30초마다 하트 1칸의 피해를 받습니다.</i>"
      "long-shots":
        "name": "<bold><#f4d35e>Long Shots"
        "desc": "<#6b7280><i>50블록 넘게 떨어진 플레이어를 맞히면 하트 1칸을 회복하고 1.5배 피해를 줍니다.</i>"
      "switcheroo":
        "name": "<bold><#f4d35e>Switcheroo"
        "desc": "<#6b7280><i>플레이어를 쏘면 서로 위치가 바뀝니다.</i>"
      "dnd":
        "name": "<bold><#f4d35e>DnD"
        "desc": "<#6b7280><i>한 플레이어와 전투를 시작하면 전투가 끝날 때까지 그 플레이어하고만 싸울 수 있습니다.</i>"
      "web-cage":
        "name": "<bold><#f4d35e>Web Cage"
        "desc": "<#6b7280><i>플레이어를 처치하면 주변이 거미줄 구체로 둘러싸입니다.</i>"
      "web-limit":
        "name": "<bold><#f4d35e>Web Limit"
        "desc": "<#6b7280><i>인벤토리에 가질 수 있는 거미줄 수가 제한됩니다.</i>"
      "grass-explosion":
        "name": "<bold><#f4d35e>Grass Explosion"
        "desc": "<#6b7280><i>잔디 위를 걸으면 25% 확률로 폭발이 일어납니다.</i>"
      "raining-tnt":
        "name": "<bold><#f4d35e>Raining TNT"
        "desc": "<#6b7280><i>일정 간격(설정 가능)마다 무작위 플레이어 2명에게 TNT가 쏟아집니다.</i>"
      "coronavirus":
        "name": "<bold><#f4d35e>Coronavirus"
        "desc": "<#6b7280><i>일정 간격(설정 가능)마다 무작위 플레이어가 멀미와 독에 걸립니다.</i>"
      "bombers":
        "name": "<bold><#f4d35e>Bombers"
        "desc": "<#6b7280><i>모두 부서지지 않는 부싯돌과 부시를 가지고 시작합니다. 대부분의 몹이 TNT를 떨어뜨립니다.</i>"
      "back-packs":
        "name": "<bold><#f4d35e>Backpacks"
        "desc": "<#6b7280><i>/backpack으로 팀 공용 배낭을 열 수 있습니다.</i>"
      "extra-inventory":
        "name": "<bold><#f4d35e>Extra Inventory"
        "desc": "<#6b7280><i>/extrainventory로 추가 인벤토리 공간을 쓸 수 있습니다.</i>"
      "nineslot":
        "name": "<bold><#f4d35e>Nine Slot"
        "desc": "<#6b7280><i>플레이어마다 인벤토리 9칸만 쓸 수 있습니다.</i>"
      "benchblitz":
        "name": "<bold><#f4d35e>Bench Blitz"
        "desc": "<#6b7280><i>제작대 1개를 가지고 시작하며 더 얻을 수 없습니다.</i>"
      "gone-fishing":
        "name": "<bold><#f4d35e>Gone Fishing"
        "desc": "<#6b7280><i>내구성 200 낚싯대와 모루 한 묶음을 받습니다.</i>"
      "puppypower":
        "name": "<bold><#f4d35e>Puppy Power"
        "desc": "<#6b7280><i>모든 플레이어가 뼈, 썩은 살점, 늑대 생성 알을 한 묶음씩 받습니다.</i>"
      "build-uhc":
        "name": "<bold><#f4d35e>Build UHC"
        "desc": "<#6b7280><i>게임 시작 시 모든 플레이어가 키트를 받습니다.</i>"
      "soup":
        "name": "<bold><#f4d35e>Soup"
        "desc": "<#6b7280><i>버섯 스튜를 우클릭하면 하트 3.5칸을 회복합니다.</i>"
      "hypixel-heads":
        "name": "<bold><#f4d35e>Hypixel Heads"
        "desc": "<#6b7280><i>플레이어 머리를 우클릭하면 재생 III 4초, 신속 II 20초를 받습니다.</i>"
      "redvsblue":
        "name": "<bold><#f4d35e>Red vs Blue"
        "desc": "<#6b7280><i>게임 시작 시 두 팀(빨강, 파랑)으로 무작위 배정됩니다.</i>"
      "moles":
        "name": "<bold><#f4d35e>Moles"
        "desc": "<#6b7280><i>팀마다 한 명이 몰래 다른 플레이어를 탈락시키려는 첩자(Mole)입니다.</i>"
      "anonymous":
        "name": "<bold><#f4d35e>Anonymous"
        "desc": "<#6b7280><i>모든 플레이어의 이름과 스킨이 숨겨집니다.</i>"
      "lafs":
        "name": "<bold><#f4d35e>LAFS"
        "desc": "<#6b7280><i>경기 전에 서로 우클릭한 플레이어끼리 팀이 됩니다.</i>"
      "tracker":
        "name": "<bold><#f4d35e>Tracker"
        "desc": "<#6b7280><i>모든 플레이어가 다른 플레이어를 추적하는 나침반을 받습니다.</i>"
      "randomizer":
        "name": "<bold><#f4d35e>Randomizer"
        "desc": "<#6b7280><i>블록마다 설정에 따라 무작위 아이템이 떨어집니다.</i>"
      "luckyroulette":
        "name": "<bold><#f4d35e>Lucky Roulette"
        "desc": "<#6b7280><i>2분마다 모든 플레이어가 무작위 아이템을 받습니다.</i>"
      "lightsout":
        "name": "<bold><#f4d35e>Lights Out"
        "desc": "<#6b7280><i>경기 중 횃불을 설치할 수 없습니다.</i>"
