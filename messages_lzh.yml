"tutorial.stop.welcome.title": "<#f4d35e><bold>歡迎至試煉UHC</bold></#f4d35e>"
"tutorial.stop.welcome.subtitle": "<#cbd5e1>略覽一周，再潛則出</#cbd5e1>"
"tutorial.stop.welcome.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>歡迎至試煉UHC</bold></#f4d35e><newline><#cbd5e1>此廳也，局間候於此。且環顧之，約一分有半。</#cbd5e1>"
"tutorial.stop.hotbar.title": "<#f4d35e><bold>快捷之欄</bold></#f4d35e>"
"tutorial.stop.hotbar.subtitle": "<#cbd5e1>諸事一擊可達</#cbd5e1>"
"tutorial.stop.hotbar.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>快捷之欄</bold></#f4d35e><newline><#cbd5e1>左為戲設、異式與伍；右為己檔與榜。此教即囊中之望遠鏡。<#93c5fd>/menu</#93c5fd> 啟捷單，<#93c5fd>/settings</#93c5fd> 啟己設。</#cbd5e1>"
"tutorial.stop.parkour.title": "<#f4d35e><bold>跑酷</bold></#f4d35e>"
"tutorial.stop.parkour.subtitle": "<#cbd5e1>越其道，勝其時</#cbd5e1>"
"tutorial.stop.parkour.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>跑酷</bold></#f4d35e><newline><#cbd5e1>踏始板則始，檢點存其進。最佳之時登於跑酷之榜。<#93c5fd>/parkour</#93c5fd></#cbd5e1>"
"tutorial.stop.spleef.title": "<#f4d35e><bold>掘地</bold></#f4d35e>"
"tutorial.stop.spleef.subtitle": "<#cbd5e1>掘人足下之地</#cbd5e1>"
"tutorial.stop.spleef.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>掘地</bold></#f4d35e><newline><#cbd5e1>掘他人足下之地，終立者勝。以 <#93c5fd>/spleef</#93c5fd> 入之。</#cbd5e1>"
"tutorial.stop.tnt-run.title": "<#f4d35e><bold>灹藥奔</bold></#f4d35e>"
"tutorial.stop.tnt-run.subtitle": "<#cbd5e1>勿止</#cbd5e1>"
"tutorial.stop.tnt-run.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>灹藥奔</bold></#f4d35e><newline><#cbd5e1>所過之地即消，終存者勝。以 <#93c5fd>/tntrun</#93c5fd> 入之。</#cbd5e1>"
"tutorial.stop.range.title": "<#f4d35e><bold>射場</bold></#f4d35e>"
"tutorial.stop.range.subtitle": "<#cbd5e1>溫其弓</#cbd5e1>"
"tutorial.stop.range.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>射場</bold></#f4d35e><newline><#cbd5e1>時盡之前，射所出之靶以得分。<#93c5fd>/range</#93c5fd></#cbd5e1>"
"tutorial.stop.leaderboards.title": "<#f4d35e><bold>榜</bold></#f4d35e>"
"tutorial.stop.leaderboards.subtitle": "<#cbd5e1>本服之魁</#cbd5e1>"
"tutorial.stop.leaderboards.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>榜</bold></#f4d35e><newline><#cbd5e1>勝、殺、K/D 諸績，分總、月、週、日。擊榜以易之。<#93c5fd>/leaderboard</#93c5fd> <#93c5fd>/profile</#93c5fd></#cbd5e1>"
"tutorial.stop.podium.title": "<#f4d35e><bold>領獎之台</bold></#f4d35e>"
"tutorial.stop.podium.subtitle": "<#cbd5e1>勝者所立</#cbd5e1>"
"tutorial.stop.podium.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>領獎之台</bold></#f4d35e><newline><#cbd5e1>每局既終，鏡至於此：先頒諸獎，後前三登台。</#cbd5e1>"
"tutorial.stop.pvp.title": "<#f4d35e><bold>廳中相搏與習場</bold></#f4d35e>"
"tutorial.stop.pvp.subtitle": "<#cbd5e1>候時亦可戰</#cbd5e1>"
"tutorial.stop.pvp.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>廳中相搏與習場</bold></#f4d35e><newline><#cbd5e1>持劍於欄三秒，可與亦啟者相搏。<#93c5fd>/practice</#93c5fd> 引汝至備全之習場。</#cbd5e1>"
"tutorial.stop.teams.title": "<#f4d35e><bold>伍、票與始物</bold></#f4d35e>"
"tutorial.stop.teams.subtitle": "<#cbd5e1>備來局</#cbd5e1>"
"tutorial.stop.teams.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>伍、票與始物</bold></#f4d35e><newline><#cbd5e1>以 <#93c5fd>/team</#93c5fd> 立伍或入伍，以 <#93c5fd>/vote</#93c5fd> 擇來局之異式，以 <#93c5fd>/kit</#93c5fd> 察始物。</#cbd5e1>"
"tutorial.stop.game-goal.title": "<#f4d35e><bold>局之道</bold></#f4d35e>"
"tutorial.stop.game-goal.subtitle": "<#cbd5e1>命唯一，血不自復。</#cbd5e1>"
"tutorial.stop.game-goal.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>局之道</bold></#f4d35e><newline><#cbd5e1>UHC 者極硬之戲：血不自復，命唯一。存至最後之人或伍勝。</#cbd5e1>"
"tutorial.stop.game-flow.title": "<#f4d35e><bold>散與休兵</bold></#f4d35e>"
"tutorial.stop.game-flow.subtitle": "<#cbd5e1>初十分不相攻</#cbd5e1>"
"tutorial.stop.game-flow.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>散與休兵</bold></#f4d35e><newline><#cbd5e1>眾散於圖中。初十分不得相攻，宜採礦、集物、造甲兵。至第十分，眾皆復滿血一次。</#cbd5e1>"
"tutorial.stop.game-border.title": "<#f4d35e><bold>界與驟死</bold></#f4d35e>"
"tutorial.stop.game-border.subtitle": "<#cbd5e1>圖漸小</#cbd5e1>"
"tutorial.stop.game-border.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>界與驟死</bold></#f4d35e><newline><#cbd5e1>自第三十分，界漸縮向中。一時之後，存者入驟死之戰以決之。</#cbd5e1>"
"tutorial.stop.game-healing.title": "<#f4d35e><bold>存身</bold></#f4d35e>"
"tutorial.stop.game-healing.subtitle": "<#cbd5e1>金林檎與金首</#cbd5e1>"
"tutorial.stop.game-healing.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>存身</bold></#f4d35e><newline><#cbd5e1>以金林檎療之。人死遺首，以金八環之成金首。<#93c5fd>/recipe</#93c5fd></#cbd5e1>"
"tutorial.stop.game-after.title": "<#f4d35e><bold>死後</bold></#f4d35e>"
"tutorial.stop.game-after.subtitle": "<#cbd5e1>觀之，復戲</#cbd5e1>"
"tutorial.stop.game-after.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>死後</bold></#f4d35e><newline><#cbd5e1>既死則為觀者，至局終；未終則廳閉。隨時可復閱：<#93c5fd>/tutorial rules</#93c5fd></#cbd5e1>"
"tutorial.book.1.title": "<#f4d35e><bold>旨</bold></#f4d35e>"
"tutorial.book.1.text": "<#cbd5e1>UHC 者極硬之戲。命唯一，血不自復，雖食飽亦然。存至最後之人或伍勝。</#cbd5e1>"
"tutorial.book.2.title": "<#f4d35e><bold>入局與伍</bold></#f4d35e>"
"tutorial.book.2.text": "<#cbd5e1>局始於廳。伍戰之時，以 /team 立伍或入伍；/tm 語伍中，/tc 示所在。無伍者，局始自分之。</#cbd5e1>"
"tutorial.book.3.title": "<#f4d35e><bold>散與休兵</bold></#f4d35e>"
"tutorial.book.3.text": "<#cbd5e1>局始，眾傳至相遠之處。初十分不得相攻：採礦、集物、造甲兵。此時亦不得置熔石、火、灹藥於他伍之側。</#cbd5e1>"
"tutorial.book.4.title": "<#f4d35e><bold>終療與界</bold></#f4d35e>"
"tutorial.book.4.text": "<#cbd5e1>至第十分，眾復滿血一次，此後無復。自第三十分，界漸縮向中，終至百格；在外者引之入。</#cbd5e1>"
"tutorial.book.5.title": "<#f4d35e><bold>驟死之戰</bold></#f4d35e>"
"tutorial.book.5.text": "<#cbd5e1>一時之後，存者皆聚於閉箱或鬥場，戰至唯一人或一伍。</#cbd5e1>"
"tutorial.book.6.title": "<#f4d35e><bold>療</bold></#f4d35e>"
"tutorial.book.6.text": "<#cbd5e1>金林檎，療之要也：林檎取於樹，金取於礦。人死遺首，於製物案以金錠八環之，成金首，勝於金林檎。/recipe 示本服之方。</#cbd5e1>"
"tutorial.book.7.title": "<#f4d35e><bold>異式與設</bold></#f4d35e>"
"tutorial.book.7.text": "<#cbd5e1>異式易局之規：/scenarios 察所行，/vote 擇來局。/kit 察始物，/config 察局之設。主者可易此書所載之時。</#cbd5e1>"
"tutorial.book.8.title": "<#f4d35e><bold>既出之後</bold></#f4d35e>"
"tutorial.book.8.text": "<#cbd5e1>既出則為觀者至局終，廳閉；局中方入者亦觀之。勝、殺與經驗入於 /profile 與榜。規：/rules，舉弊：/report。</#cbd5e1>"
"tutorial.only-lobby": "唯於廳中、無局之時可觀教。"
