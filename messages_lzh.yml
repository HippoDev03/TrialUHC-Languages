"tutorial.offer.title": "<#f4d35e><bold>歡迎至試煉UHC！</bold></#f4d35e>"
"tutorial.offer.body": "<#cbd5e1>初至乎？略以鏡覽廳，並述局之道（約一分有半）。隨時再潛則出。</#cbd5e1>"
"tutorial.offer.yes": "<#6dd3a0>示我</#6dd3a0>"
"tutorial.offer.later": "<#7b8aa0>後之</#7b8aa0>"
