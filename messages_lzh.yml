        "desc": "<#6b7280><i>受墜傷，則得緩速三十秒。</i>"
      "sky-high":
        "name": "<bold><#f4d35e>高處求生"
        "desc": "<#6b7280><i>戲者在所設 Y 之下，每三十秒損血一心。</i>"
      "long-shots":
        "name": "<bold><#f4d35e>遠射"
        "desc": "<#6b7280><i>於五十格外射中戲者，復血一心，其傷一倍半。</i>"
      "switcheroo":
        "name": "<bold><#f4d35e>易位"
        "desc": "<#6b7280><i>射中戲者，則與之易位。</i>"
      "dnd":
        "name": "<bold><#f4d35e>勿擾"
        "desc": "<#6b7280><i>與一人交戰，戰未畢，唯可與之戰。</i>"
      "web-cage":
        "name": "<bold><#f4d35e>蛛網之籠"
        "desc": "<#6b7280><i>斬人之後，蛛網環汝。</i>"
      "web-limit":
        "name": "<bold><#f4d35e>蛛網之限"
        "desc": "<#6b7280><i>每人囊中蛛網有其限。</i>"
      "grass-explosion":
        "name": "<bold><#f4d35e>草爆"
        "desc": "<#6b7280><i>行於草上，四之一或爆。</i>"
      "raining-tnt":
        "name": "<bold><#f4d35e>TNT 之雨"
        "desc": "<#6b7280><i>每隔若干時（可設），TNT 墜於隨機二人之上。</i>"
      "coronavirus":
        "name": "<bold><#f4d35e>疫"
        "desc": "<#6b7280><i>每隔若干時（可設），隨機一人得噁心與中毒。</i>"
      "bombers":
        "name": "<bold><#f4d35e>轟者"
        "desc": "<#6b7280><i>眾人始得不壞之打火石，諸怪多墜 TNT。</i>"
      "back-packs":
        "name": "<bold><#f4d35e>伍之囊"
        "desc": "<#6b7280><i>戲者可以 /backpack 啟同伍共用之囊。</i>"
      "extra-inventory":
        "name": "<bold><#f4d35e>餘格"
        "desc": "<#6b7280><i>戲者可以 /extrainventory 用額外之藏。</i>"
      "nineslot":
        "name": "<bold><#f4d35e>九格之囊"
        "desc": "<#6b7280><i>每人唯可用物格九。</i>"
      "benchblitz":
        "name": "<bold><#f4d35e>一臺之戰"
        "desc": "<#6b7280><i>戲者始得工作臺一，不得更得。</i>"
      "gone-fishing":
        "name": "<bold><#f4d35e>垂釣"
        "desc": "<#6b7280><i>戲者得耐久二百之釣竿一，及鐵砧一組。</i>"
      "puppypower":
        "name": "<bold><#f4d35e>犬之力"
        "desc": "<#6b7280><i>眾戲者得骨、腐肉及狼之生蛋各一組。</i>"
      "build-uhc":
        "name": "<bold><#f4d35e>築 UHC"
        "desc": "<#6b7280><i>眾戲者於局始得一套之裝。</i>"
      "soup":
        "name": "<bold><#f4d35e>菌羹"
        "desc": "<#6b7280><i>右擊菌羹，復血三心半。</i>"
      "hypixel-heads":
        "name": "<bold><#f4d35e>Hypixel 之首"
        "desc": "<#6b7280><i>右擊戲者之首，得回復 III 四秒、速 II 二十秒。</i>"
      "redvsblue":
        "name": "<bold><#f4d35e>赤藍相爭"
        "desc": "<#6b7280><i>局始之時，隨分赤、藍二伍。</i>"
      "moles":
        "name": "<bold><#f4d35e>內奸"
        "desc": "<#6b7280><i>每伍有一人陰為內奸，暗汰他人。</i>"
      "anonymous":
        "name": "<bold><#f4d35e>匿名"
        "desc": "<#6b7280><i>隱眾戲者之名與貌。</i>"
      "lafs":
        "name": "<bold><#f4d35e>自結為伍"
        "desc": "<#6b7280><i>局始之前，戲者相右擊即結為伍。</i>"
      "tracker":
        "name": "<bold><#f4d35e>追蹤者"
        "desc": "<#6b7280><i>眾戲者得羅盤一，可追他人。</i>"
      "randomizer":
        "name": "<bold><#f4d35e>隨墜"
        "desc": "<#6b7280><i>每種方塊依所設而墜隨機之物。</i>"
      "luckyroulette":
        "name": "<bold><#f4d35e>福輪"
        "desc": "<#6b7280><i>每二分，眾戲者各得隨機之物一。</i>"
      "lightsout":
        "name": "<bold><#f4d35e>滅燭"
        "desc": "<#6b7280><i>局中戲者不得置火把。</i>"
