    "level": "<#f4d35e><bold>/uhc level</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/uhc level [戲者]</#93c5fd> <#7b8aa0>- 觀等、經驗與進階之度</#7b8aa0>"
    "experience": "<#f4d35e><bold>/admin experience</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin experience <戲者|名式> set <數></#93c5fd> <#7b8aa0>- 定總經驗</#7b8aa0><newline> <#93c5fd>/admin experience <戲者|名式> add|remove <數></#93c5fd> <#7b8aa0>- 增減經驗</#7b8aa0><newline> <#93c5fd>/admin experience <戲者|名式> setlevel <等></#93c5fd> <#7b8aa0>- 逕定其等</#7b8aa0><newline> <#64748b>經驗百 = 一等 · * 代任意字，如 HippoDev_*</#64748b>"
    "revive": "<#f4d35e><bold>/revive</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/revive <戲者></#93c5fd> <#7b8aa0>- 復被汰之戲者</#7b8aa0>"
    "lobbygame": "<#f4d35e><bold>/admin lobbygame</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin lobbygame start <game></#93c5fd> <#7b8aa0>- math、unscramble、type、trivia、number、reaction、treasure、potato</#7b8aa0><newline> <#93c5fd>/admin lobbygame stop</#93c5fd> <#7b8aa0>- 止方行之戲</#7b8aa0><newline> <#93c5fd>/admin lobbygame word <add|remove|list> [字]</#93c5fd> <#7b8aa0>- 修重組之字表</#7b8aa0><newline> <#93c5fd>/admin lobbygame parkour <setstart|addcheckpoint|removecheckpoint|setfinish|clear|resettimes|top></#93c5fd> <#7b8aa0>- 設跑酷</#7b8aa0>"
    "pm": "<#f4d35e><bold>/msg</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/msg <戲者> <言></#93c5fd> <#7b8aa0>- 致私書</#7b8aa0>"
    "reply": "<#f4d35e><bold>/r</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/r <言></#93c5fd> <#7b8aa0>- 覆前之私書</#7b8aa0>"
    "profile": "<#f4d35e><bold>/profile</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/profile [戲者]</#93c5fd> <#7b8aa0>- 觀其錄</#7b8aa0><newline> <#93c5fd>/profile list [頁]</#93c5fd> <#7b8aa0>- 列已存之錄</#7b8aa0>"
    "world":
      "root": "<#f4d35e><bold>/world</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world list | current</#93c5fd> <#7b8aa0>- 列諸界／觀賽界</#7b8aa0><newline> <#93c5fd>/world gen [界]</#93c5fd> <#7b8aa0>- 生賽界</#7b8aa0><newline> <#93c5fd>/world load|unload <界></#93c5fd> <#7b8aa0>- 載或卸一界</#7b8aa0><newline> <#93c5fd>/world select <界></#93c5fd> <#7b8aa0>- 定為賽界</#7b8aa0><newline> <#93c5fd>/world tp [界]</#93c5fd> <#7b8aa0>- 傳至一界</#7b8aa0><newline> <#93c5fd>/world preload [界] [半徑]</#93c5fd> <#7b8aa0>- 以 Chunky 預生之</#7b8aa0><newline> <#93c5fd>/world regen [界] | delete <界></#93c5fd> <#7b8aa0>- 重生／刪一界</#7b8aa0><newline> <#93c5fd>/world clean</#93c5fd> <#7b8aa0>- 盡刪所生之 uhc_ 界</#7b8aa0>"
      "load": "<#f4d35e><bold>/world load</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world load <界></#93c5fd> <#7b8aa0>- 載界之夾</#7b8aa0>"
      "unload": "<#f4d35e><bold>/world unload</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world unload <界></#93c5fd> <#7b8aa0>- 卸一界</#7b8aa0>"
      "tp": "<#f4d35e><bold>/world tp</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world tp [界]</#93c5fd> <#7b8aa0>- 傳至一界（不書則賽界）</#7b8aa0>"
      "preload": "<#f4d35e><bold>/world preload</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world preload [界] [半徑]</#93c5fd> <#7b8aa0>- 以 Chunky 預生之</#7b8aa0>"
    "border": "<#f4d35e><bold>/admin border</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin border info</#93c5fd> <#7b8aa0>- 今之廣與中</#7b8aa0><newline> <#93c5fd>/admin border set <廣></#93c5fd> <#7b8aa0>- 立定其廣</#7b8aa0><newline> <#93c5fd>/admin border center <x> <z></#93c5fd> <#7b8aa0>- 移其中</#7b8aa0><newline> <#93c5fd>/admin border shrink <廣> <秒></#93c5fd> <#7b8aa0>- 於限時內縮之</#7b8aa0><newline> <#93c5fd>/admin border reset</#93c5fd> <#7b8aa0>- 復所設之廣</#7b8aa0>"
    "announce": "<#f4d35e><bold>/staff announce</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/staff announce <言></#93c5fd> <#7b8aa0>- 布大告於眾</#7b8aa0><newline> <#64748b>| = 換行 · [en] … [zh_tw] … 依戲者之語示之</#64748b>"
