  "uhc":
    "root": "<#f4d35e><bold>/uhc</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/uhc help [頁]</#93c5fd> <#7b8aa0>- 汝可用之令</#7b8aa0><newline> <#93c5fd>/uhc level [戲者]</#93c5fd> <#7b8aa0>- 等與經驗</#7b8aa0><newline> <#93c5fd>/uhc recipes</#93c5fd> <#7b8aa0>- 自訂之合成譜</#7b8aa0><newline> <#64748b>主事之具：/admin · 執事之具：/staff help</#64748b>"
    "kill": "<#f4d35e><bold>/kill</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/kill <戲者|選擇器></#93c5fd> <#7b8aa0>- 汰戲者（* = 眾存者）</#7b8aa0>"
    "level": "<#f4d35e><bold>/uhc level</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/uhc level [戲者]</#93c5fd> <#7b8aa0>- 觀等、經驗與進階之度</#7b8aa0>"
    "experience": "<#f4d35e><bold>/admin player xp</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin player xp <戲者|名式> set <數></#93c5fd> <#7b8aa0>- 定總經驗</#7b8aa0><newline> <#93c5fd>/admin player xp <戲者|名式> add|remove <數></#93c5fd> <#7b8aa0>- 增減經驗</#7b8aa0><newline> <#93c5fd>/admin player xp <戲者|名式> setlevel <等></#93c5fd> <#7b8aa0>- 逕定其等</#7b8aa0><newline> <#64748b>經驗百 = 一等 · * 代任意字，如 HippoDev_*</#64748b>"
    "revive": "<#f4d35e><bold>/revive</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/revive <戲者></#93c5fd> <#7b8aa0>- 復被汰之戲者</#7b8aa0>"
    "lobbygame": "<#f4d35e><bold>/admin lobby games</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin lobby games start <game></#93c5fd> <#7b8aa0>- math、unscramble、type、trivia、number、reaction、treasure、potato</#7b8aa0><newline> <#93c5fd>/admin lobby games stop</#93c5fd> <#7b8aa0>- 止方行之戲</#7b8aa0><newline> <#93c5fd>/admin lobby games word <add|remove|list> [字]</#93c5fd> <#7b8aa0>- 修重組之字表</#7b8aa0><newline> <#93c5fd>/admin lobby games parkour <setstart|addcheckpoint|removecheckpoint|setfinish|clear|resettimes|top></#93c5fd> <#7b8aa0>- 設跑酷</#7b8aa0><newline> <#93c5fd>/admin lobby games range <setlane|removelane|addstray|removestray|addtarget|removetarget|area1|area2|cleararea|list|top> [道]</#93c5fd> <#7b8aa0>- 設射圃</#7b8aa0><newline> <#93c5fd>/admin lobby games spleef|tntrun <pos1|pos2|save|setjoin|info|start|stop|clear></#93c5fd> <#7b8aa0>- 設掘地、灹藥疾走</#7b8aa0>"
    "pm": "<#f4d35e><bold>/msg</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/msg <戲者> <言></#93c5fd> <#7b8aa0>- 致私書</#7b8aa0>"
    "reply": "<#f4d35e><bold>/r</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/r <言></#93c5fd> <#7b8aa0>- 覆前之私書</#7b8aa0>"
    "profile": "<#f4d35e><bold>/profile</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/profile [戲者]</#93c5fd> <#7b8aa0>- 觀其錄</#7b8aa0><newline> <#93c5fd>/profile list [頁]</#93c5fd> <#7b8aa0>- 列已存之錄</#7b8aa0>"
    "world":
      "root": "<#f4d35e><bold>/world</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world list | current</#93c5fd> <#7b8aa0>- 列諸界／觀賽界</#7b8aa0><newline> <#93c5fd>/world gen [界]</#93c5fd> <#7b8aa0>- 生賽界</#7b8aa0><newline> <#93c5fd>/world load|unload <界></#93c5fd> <#7b8aa0>- 載或卸一界</#7b8aa0><newline> <#93c5fd>/world select <界></#93c5fd> <#7b8aa0>- 定為賽界</#7b8aa0><newline> <#93c5fd>/world tp [界]</#93c5fd> <#7b8aa0>- 傳至一界</#7b8aa0><newline> <#93c5fd>/world preload [界] [半徑]</#93c5fd> <#7b8aa0>- 以 Chunky 預生之</#7b8aa0><newline> <#93c5fd>/world regen [界] | delete <界></#93c5fd> <#7b8aa0>- 重生／刪一界</#7b8aa0><newline> <#93c5fd>/world seed save [名] | list | remove <名></#93c5fd> <#7b8aa0>- 存賽界之種／所存之種</#7b8aa0><newline> <#93c5fd>/world clean</#93c5fd> <#7b8aa0>- 盡刪所生之 uhc_ 界</#7b8aa0>"
      "load": "<#f4d35e><bold>/world load</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world load <界></#93c5fd> <#7b8aa0>- 載界之夾</#7b8aa0>"
      "unload": "<#f4d35e><bold>/world unload</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world unload <界></#93c5fd> <#7b8aa0>- 卸一界</#7b8aa0>"
      "tp": "<#f4d35e><bold>/world tp</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world tp [界]</#93c5fd> <#7b8aa0>- 傳至一界（不書則賽界）</#7b8aa0>"
      "preload": "<#f4d35e><bold>/world preload</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world preload [界] [半徑]</#93c5fd> <#7b8aa0>- 以 Chunky 預生之</#7b8aa0>"
      "seed": "<#f4d35e><bold>/world seed</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world seed save [名]</#93c5fd> <#7b8aa0>- 存賽界（或所預觀之界）之種</#7b8aa0><newline> <#93c5fd>/world seed list</#93c5fd> <#7b8aa0>- 所存之種（擊之以生）</#7b8aa0><newline> <#93c5fd>/world seed remove <名></#93c5fd> <#7b8aa0>- 去所存之種</#7b8aa0><newline> <#64748b>以 /admin world gen seed=<名> 生之，或 seed=saved 隨取所存之一。</#64748b>"
