"tutorial.admin.usage": "<#f4d35e><bold>/admin lobby tutorial</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial point <站></#93c5fd> <#7b8aa0>- 於汝所立、向汝所視，增一鏡點；鏡依次飛經諸點</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial record <站></#93c5fd> <#7b8aa0>- 即錄其鏡：自飛之，復輸 record 以終</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial setstop <站></#93c5fd> <#7b8aa0>- 自此重始其路</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial clearstop <站></#93c5fd> <#7b8aa0>- 復環其處</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial stops</#93c5fd> <#7b8aa0>- 諸站與其鏡</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial test [站]</#93c5fd> <#7b8aa0>- 自觀之（或觀一站）</#7b8aa0>"
