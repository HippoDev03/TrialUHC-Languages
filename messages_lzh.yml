"tutorial.finished": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#6dd3a0>覽畢！</#6dd3a0><#cbd5e1>欲徐閱局之道：<click:run_command:'/tutorial rules'><hover:show_text:'/tutorial rules'><white><u>/tutorial rules</u></white></hover></click>。復觀：/tutorial。</#cbd5e1>"
"tutorial.left": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#cbd5e1>教止。隨時以 <white>/tutorial</white> 復觀。</#cbd5e1>"
