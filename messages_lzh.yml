    "root": "<#f4d35e><bold>/uhc</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/uhc help [頁]</#93c5fd> <#7b8aa0>- 汝可用之令</#7b8aa0><newline> <#93c5fd>/uhc level [戲者]</#93c5fd> <#7b8aa0>- 等與經驗</#7b8aa0><newline> <#93c5fd>/uhc recipes</#93c5fd> <#7b8aa0>- 自訂之合成譜</#7b8aa0><newline> <#93c5fd>/uhc docs</#93c5fd> <#7b8aa0>- 戲中之指南</#7b8aa0><newline> <#64748b>主事之具：/admin · 執事之具：/staff help</#64748b>"
