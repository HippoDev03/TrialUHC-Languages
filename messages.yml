"tutorial.stop.welcome.title": "<#f4d35e><bold>Welcome to TrialUHC</bold></#f4d35e>"
"tutorial.stop.welcome.subtitle": "<#cbd5e1>A quick tour - sneak twice to leave</#cbd5e1>"
"tutorial.stop.welcome.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Welcome to TrialUHC</bold></#f4d35e><newline><#cbd5e1>This is the lobby: you wait here between matches. Let's look around - it takes about a minute and a half.</#cbd5e1>"
"tutorial.stop.hotbar.title": "<#f4d35e><bold>Your hotbar</bold></#f4d35e>"
"tutorial.stop.hotbar.subtitle": "<#cbd5e1>Everything is one click away</#cbd5e1>"
"tutorial.stop.hotbar.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Your hotbar</bold></#f4d35e><newline><#cbd5e1>Game settings, scenarios and teams are on the left; your profile and the leaderboards on the right. This tutorial is the spyglass in your inventory. <#93c5fd>/menu</#93c5fd> opens the quick menu, <#93c5fd>/settings</#93c5fd> your own settings.</#cbd5e1>"
"tutorial.stop.parkour.title": "<#f4d35e><bold>Parkour</bold></#f4d35e>"
"tutorial.stop.parkour.subtitle": "<#cbd5e1>Beat the course, beat the clock</#cbd5e1>"
"tutorial.stop.parkour.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Parkour</bold></#f4d35e><newline><#cbd5e1>Step on the start plate to begin; checkpoints save your progress. Your best time goes on the parkour leaderboard. <#93c5fd>/parkour</#93c5fd></#cbd5e1>"
"tutorial.stop.spleef.title": "<#f4d35e><bold>Spleef</bold></#f4d35e>"
"tutorial.stop.spleef.subtitle": "<#cbd5e1>Dig the floor out from under them</#cbd5e1>"
"tutorial.stop.spleef.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Spleef</bold></#f4d35e><newline><#cbd5e1>Break the floor under the others - the last one standing wins. Join with <#93c5fd>/spleef</#93c5fd>.</#cbd5e1>"
"tutorial.stop.tnt-run.title": "<#f4d35e><bold>TNT Run</bold></#f4d35e>"
"tutorial.stop.tnt-run.subtitle": "<#cbd5e1>Don't stop moving</#cbd5e1>"
"tutorial.stop.tnt-run.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>TNT Run</bold></#f4d35e><newline><#cbd5e1>The floor vanishes behind you as you run; the last one up wins. Join with <#93c5fd>/tntrun</#93c5fd>.</#cbd5e1>"
"tutorial.stop.range.title": "<#f4d35e><bold>Shooting range</bold></#f4d35e>"
"tutorial.stop.range.subtitle": "<#cbd5e1>Warm up your bow</#cbd5e1>"
"tutorial.stop.range.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Shooting range</bold></#f4d35e><newline><#cbd5e1>Hit the targets that pop up for points before your time runs out. <#93c5fd>/range</#93c5fd></#cbd5e1>"
"tutorial.stop.leaderboards.title": "<#f4d35e><bold>Leaderboards</bold></#f4d35e>"
"tutorial.stop.leaderboards.subtitle": "<#cbd5e1>The best players of the server</#cbd5e1>"
"tutorial.stop.leaderboards.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Leaderboards</bold></#f4d35e><newline><#cbd5e1>Wins, kills, K/D and more - all time, monthly, weekly and daily. Click a board to switch. <#93c5fd>/leaderboard</#93c5fd> <#93c5fd>/profile</#93c5fd></#cbd5e1>"
"tutorial.stop.podium.title": "<#f4d35e><bold>The podium</bold></#f4d35e>"
"tutorial.stop.podium.subtitle": "<#cbd5e1>Where the winners stand</#cbd5e1>"
"tutorial.stop.podium.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>The podium</bold></#f4d35e><newline><#cbd5e1>After every match the camera comes here: awards for the best players, then the top 3 on the podium.</#cbd5e1>"
"tutorial.stop.pvp.title": "<#f4d35e><bold>Lobby PvP and practice</bold></#f4d35e>"
"tutorial.stop.pvp.subtitle": "<#cbd5e1>Fight while you wait</#cbd5e1>"
"tutorial.stop.pvp.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Lobby PvP and practice</bold></#f4d35e><newline><#cbd5e1>Hold the sword in your hotbar for 3 seconds to fight others who turned it on too. <#93c5fd>/practice</#93c5fd> takes you to a practice arena with a full kit.</#cbd5e1>"
"tutorial.stop.teams.title": "<#f4d35e><bold>Teams, votes and kits</bold></#f4d35e>"
"tutorial.stop.teams.subtitle": "<#cbd5e1>Get ready for the next match</#cbd5e1>"
"tutorial.stop.teams.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Teams, votes and kits</bold></#f4d35e><newline><#cbd5e1>Make or join a team with <#93c5fd>/team</#93c5fd>, vote for the next scenarios with <#93c5fd>/vote</#93c5fd>, and see the starting kit with <#93c5fd>/kit</#93c5fd>.</#cbd5e1>"
"tutorial.stop.game-goal.title": "<#f4d35e><bold>How a match works</bold></#f4d35e>"
"tutorial.stop.game-goal.subtitle": "<#cbd5e1>One life. No natural healing.</#cbd5e1>"
"tutorial.stop.game-goal.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>How a match works</bold></#f4d35e><newline><#cbd5e1>UHC is Ultra Hardcore: your health doesn't come back by itself and you only have one life. The last player or team alive wins.</#cbd5e1>"
"tutorial.stop.game-flow.title": "<#f4d35e><bold>Scatter and grace</bold></#f4d35e>"
"tutorial.stop.game-flow.subtitle": "<#cbd5e1>10 minutes without PvP</#cbd5e1>"
"tutorial.stop.game-flow.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Scatter and grace</bold></#f4d35e><newline><#cbd5e1>Everyone is spread across the map. For the first 10 minutes PvP is off - mine, gather and craft your gear. At minute 10 everyone is healed once.</#cbd5e1>"
"tutorial.stop.game-border.title": "<#f4d35e><bold>The border and sudden death</bold></#f4d35e>"
"tutorial.stop.game-border.subtitle": "<#cbd5e1>The map gets smaller</#cbd5e1>"
"tutorial.stop.game-border.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>The border and sudden death</bold></#f4d35e><newline><#cbd5e1>From minute 30 the border closes in on the centre. After an hour, everyone left fights it out in sudden death.</#cbd5e1>"
"tutorial.stop.game-healing.title": "<#f4d35e><bold>Staying alive</bold></#f4d35e>"
"tutorial.stop.game-healing.subtitle": "<#cbd5e1>Golden apples and golden heads</#cbd5e1>"
"tutorial.stop.game-healing.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>Staying alive</bold></#f4d35e><newline><#cbd5e1>Heal with golden apples. A killed player drops their head: surround it with 8 gold for a golden head. <#93c5fd>/recipe</#93c5fd></#cbd5e1>"
"tutorial.stop.game-after.title": "<#f4d35e><bold>After you die</bold></#f4d35e>"
"tutorial.stop.game-after.subtitle": "<#cbd5e1>Watch, then play again</#cbd5e1>"
"tutorial.stop.game-after.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>After you die</bold></#f4d35e><newline><#cbd5e1>You become a spectator until the match ends - the lobby is locked till then. Read it all again any time: <#93c5fd>/tutorial rules</#93c5fd></#cbd5e1>"
"tutorial.book.1.title": "<#f4d35e><bold>The goal</bold></#f4d35e>"
"tutorial.book.1.text": "<#cbd5e1>UHC is Ultra Hardcore. You have one life and your health doesn't come back by itself - not even with a full food bar. The last player or team alive wins.</#cbd5e1>"
"tutorial.book.2.title": "<#f4d35e><bold>Joining and teams</bold></#f4d35e>"
"tutorial.book.2.text": "<#cbd5e1>Matches start from the lobby. In team matches, make or join a team with /team; /tm talks to your team and /tc shares your coordinates. Anyone without a team gets one when the match starts.</#cbd5e1>"
"tutorial.book.3.title": "<#f4d35e><bold>Scatter and grace period</bold></#f4d35e>"
"tutorial.book.3.text": "<#cbd5e1>When the match starts, everyone is teleported far apart. For the first 10 minutes PvP is off: mine, gather and craft your gear. Lava, fire and TNT can't be placed near other teams yet either.</#cbd5e1>"
"tutorial.book.4.title": "<#f4d35e><bold>Final heal and the border</bold></#f4d35e>"
"tutorial.book.4.text": "<#cbd5e1>At minute 10 everyone is healed to full once - the last free health of the match. From minute 30 the border closes in on the centre, down to 100 blocks across; anyone outside is pulled back in.</#cbd5e1>"
"tutorial.book.5.title": "<#f4d35e><bold>Sudden death</bold></#f4d35e>"
"tutorial.book.5.text": "<#cbd5e1>After an hour, everyone still alive is brought together in a closed box or a meetup arena and fights until one player or team is left.</#cbd5e1>"
"tutorial.book.6.title": "<#f4d35e><bold>Healing</bold></#f4d35e>"
"tutorial.book.6.text": "<#cbd5e1>Golden apples are the main way to heal: apples from trees, gold from mining. A killed player drops their head - surround it with 8 gold ingots in a crafting table for a golden head, a stronger golden apple. /recipe shows the server's recipes.</#cbd5e1>"
"tutorial.book.7.title": "<#f4d35e><bold>Scenarios and settings</bold></#f4d35e>"
"tutorial.book.7.text": "<#cbd5e1>Scenarios change the rules of a match - /scenarios shows which are on and /vote picks the next ones. /kit shows the starting kit and /config the match settings. Hosts can change the times in this book.</#cbd5e1>"
"tutorial.book.8.title": "<#f4d35e><bold>After you're out</bold></#f4d35e>"
"tutorial.book.8.text": "<#cbd5e1>Once you're out you're a spectator until the match ends - the lobby is locked, and players who join during a match spectate too. Your wins, kills and XP go to /profile and the leaderboards. Rules: /rules - report cheaters: /report.</#cbd5e1>"
"tutorial.only-lobby": "You can only watch the tutorial in the lobby while no match is running."
"tutorial.busy": "Leave what you're doing first (a lobby game, practice, spectating or staff mode)."
"tutorial.unavailable": "The tutorial isn't set up yet - the lobby spawn is missing."
"tutorial.started": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#cbd5e1>Tutorial started. <white>Sneak twice</white> to leave.</#cbd5e1>"
"tutorial.finished": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#6dd3a0>That's the tour!</#6dd3a0> <#cbd5e1>Read how a match works at your own pace: <click:run_command:'/tutorial rules'><hover:show_text:'/tutorial rules'><white><u>/tutorial rules</u></white></hover></click>. Watch it again with /tutorial.</#cbd5e1>"
"tutorial.left": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#cbd5e1>Tutorial ended. Watch it again any time with <white>/tutorial</white>.</#cbd5e1>"
