"tutorial.admin.usage": "<#f4d35e><bold>/admin lobby tutorial</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial point <stop></#93c5fd> <#7b8aa0>- adds a camera point where you stand, looking where you look; the camera flies through them in order</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial record <stop></#93c5fd> <#7b8aa0>- record the shot live: fly it yourself, run record again to finish</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial setstop <stop></#93c5fd> <#7b8aa0>- starts the stop's path over from here</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial clearstop <stop></#93c5fd> <#7b8aa0>- back to circling the system's own spot</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial stops</#93c5fd> <#7b8aa0>- every stop and its shot</#7b8aa0><newline> <#93c5fd>/admin lobby tutorial test [stop]</#93c5fd> <#7b8aa0>- watch it (or one stop) yourself</#7b8aa0>"
"tutorial.admin.unknown-stop": "<#f95738>Unknown stop. Stops: <white><stops></white></#f95738>"
"tutorial.admin.cleared": "<#6dd3a0>Stop <white><stop></white> is back to its default shot.</#6dd3a0>"
"tutorial.admin.point-added": "<#6dd3a0>Stop <white><stop></white>: camera point <white>#<number></white> at <white><x>, <y>, <z></white>, looking where you look. Add more to make the camera fly through them.</#6dd3a0>"
"tutorial.admin.list-header": "<#f4d35e><bold>Tutorial stops</bold></#f4d35e>"
"tutorial.admin.list-entry": " <#93c5fd><stop></#93c5fd> <#7b8aa0>- <state></#7b8aa0>"
"tutorial.admin.state-set": "camera path, <points> point(s)"
