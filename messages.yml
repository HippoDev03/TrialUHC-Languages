"tutorial.admin.state-none": "left out (not set up)"
"tutorial.admin.record-started": "<#6dd3a0>Recording <white><stop></white>: you are the camera now, fly the shot (spectator mode flies through walls). Run <white>/admin lobby tutorial record</white> again to finish (up to 60 seconds). It plays back at the speed you fly.</#6dd3a0>"
"tutorial.admin.recording": "<#f95738>● REC</#f95738> <white><stop></white> <#7b8aa0><seconds>s - /admin lobby tutorial record to finish</#7b8aa0>"
"tutorial.admin.record-saved": "<#6dd3a0>Stop <white><stop></white>: recorded <white><seconds>s</white> of camera. Watch it with <white>/admin lobby tutorial test <stop></white>.</#6dd3a0>"
