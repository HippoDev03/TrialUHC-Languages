          glowing: Player Glowing
      border:
        initial:
          size: Initial Border Size
        final:
          size: Final Border Size
        shrink:
          start:
            seconds: Border Shrink Start
          duration:
            seconds: Border Shrink Duration
        force:
          tp:
            inside: Border Force TP Inside
            buffer: Border Force TP Buffer
        first:
          shrink:
            size: First Shrink Size
      rules:
        spectator:
          on:
            death: Spectator On Death
        disable:
          natural:
            regen: Disable Natural Regen
        kick:
          on:
            death: Kick On Death
        drop:
          head:
            on:
              kill: Drop Head On Kill
      teams:
        enabled: Teams Enabled
        max:
          size: Team Max Size
        friendly:
          fire: Friendly Fire
        teammate:
          glow: Teammate Glow
        allow:
          lobby:
            switch: Lobby Team Switching
        auto:
          balance:
            on:
              start: Auto Balance On Start
        show:
          teammates:
            in:
              lobby: Show Teammates In Lobby
              game: Show Teammates In Game
        voice:
          chat:
            enabled: Team Voice Chat
            global:
              lobby: Global Lobby Voice
            team:
              groups:
                in:
                  game: In-Game Team Voice
    desc:
      game:
        antiburn: Prevents players from taking damage from fire and lava.
        no:
          mobs: Disables all hostile mob spawning during the match.
          suspicious:
            stew: Removes suspicious stew from gameplay.
          enchanting: Prevents players from using enchanting tables.
          brewing: Prevents players from brewing potions.
          grindstone: Prevents players from using grindstones.
        mob:
          rate:
            multiplier: Multiplier applied to natural mob spawn rates. 1.0 = normal.
        apple:
          rate: Multiplier for golden apple drops from leaf decay. 1.0 = normal.
        mobs:
          attack: Whether hostile mobs will target and attack players.
        allow:
          potions: Whether players are allowed to use potions.
        difficulty: World difficulty. Affects mob damage and hunger drain.
        min:
          players: Minimum number of players required to start a match.
        countdown:
          seconds: Duration of the pre-scatter countdown.
        grace:
          period:
            seconds: PvP is disabled for this many seconds after scatter. Set to 0 to skip.
        nametag:
          hide:
            seconds: Player nametags are hidden for this many seconds at match start. Set to 0 to always show.
        final:
          heal:
            seconds: Players receive a full heal this many seconds before the match ends (max-duration-seconds). Set to 0 to disable.
          duel:
            seconds: Duration of the final duel when only 2 players remain.
        scatter:
          radius: Maximum radius in blocks that players are scattered within.
          last:
            countdown: Shows a title countdown during the last N seconds of the scatter sequence.
        max:
          duration:
            seconds: Maximum match duration before sudden death is triggered. Set to 0 for no limit.
        sudden:
          death:
            seconds: Duration of the sudden death phase. Set to 0 to skip sudden death and end immediately.
        ender:
          pearl:
            damage: Whether ender pearl throws deal fall damage on landing.
        shears:
          enabled: Whether shearing a sheep can drop a golden apple.
          rate: 1-in-N chance for shears to drop a golden apple when used on a sheep.
        enchanted:
          golden:
            apples: Whether enchanted golden apples can be found and used.
        golden:
          heads: Enables craftable golden heads using a player head and gold ingots.
        player:
          glowing: All players glow and are visible through walls.
      border:
        initial:
          size: Starting world border diameter in blocks.
        final:
          size: Final world border diameter after fully shrunk.
        shrink:
          start:
            seconds: Seconds after match start before the border begins shrinking.
          duration:
            seconds: Total time in seconds for the border to shrink to its final size.
        force:
          tp:
            inside: Automatically teleports players who are outside the border back in.
            buffer: Distance from the border edge when force-teleporting players inside.
        first:
          shrink:
            size: Immediately shrinks the border to this size at match start. Set to 0 to disable.
      rules:
        spectator:
          on:
            death: Eliminated players become spectators instead of being disconnected.
        disable:
          natural:
            regen: Prevents health regeneration through saturation. Players must use golden apples to heal.
        kick:
          on:
            death: Kicks players from the server the moment they are eliminated.
        drop:
          head:
            on:
              kill: Drops the killed player's head as an item that can be used to craft golden heads.
      teams:
        enabled: Enables team mode. Players are grouped into teams and win together.
        max:
          size: Maximum number of players allowed per team.
        friendly:
          fire: Whether teammates can deal damage to each other.
        teammate:
          glow: Highlights teammates with a glowing outline visible through walls.
        allow:
          lobby:
            switch: Allows players to freely switch teams in the lobby.
        auto:
          balance:
            on:
              start: Automatically moves players to balance team sizes when the match starts.
        show:
          teammates:
            in:
              lobby: Makes all team members visible to each other in the lobby.
              game: Makes all team members visible to each other during the match.
        voice:
          chat:
            enabled: Enables Simple Voice Chat integration for team-based voice channels.
            global:
              lobby: Creates a shared global voice channel for all players in the lobby.
            team:
              groups:
                in:
                  game: Creates separate voice channels per team during the match.
    option:
      min:
        players: "<#f4d35e><bold>Min Players</bold></#f4d35e>"
      countdown: "<#f4d35e><bold>Countdown Seconds</bold></#f4d35e>"
      disable:
        natural:
          regen: "<#f95738><bold>Disable Natural Regen</bold></#f95738>"
      spectator:
        'on':
          death: "<#7dd3fc><bold>Spectator On Death</bold></#7dd3fc>"
      chunky:
        enabled: "<#86efac><bold>Chunky Integration</bold></#86efac>"
      global:
        announcements: "<#c4b5fd><bold>Global Bungee Announce</bold></#c4b5fd>"
help:
  title: "<gold>UHC Commands </gold><yellow>(<page>/<max_page>)</yellow>"
  suggest:
    hover: "<gray>Suggest <command></gray>"
  open:
    page:
      hover: "<gray>Open page <page></gray>"
  prev:
    button: "« Prev"
  next:
    button: Next »
  desc:
    pause: Pause or resume the active match.
    resume: Resume a paused match.
    start: Start the match countdown.
    forcestart: Skip countdown and start scatter.
    stop: Stop the active match.
    state: Show current match state.
    setlobby: Set the lobby spawn to your location.
    skipgrace: End grace and enable PvP.
    skipphase: Skip the current match phase.
    rescatter: Re-scatter active participants (scatter or grace period only).
    reload: Reload TrialUHC configs.
    checkready: Open a ready-check GUI for all online players.
    reset: Force reset all match state.
    gen: Generate and select a game world.
    preload:
      status: Show the active Chunky preload progress.
      stop: Cancel the active Chunky preload.
    kill: Eliminate a player or selector.
    killalloffline: Eliminate all disconnected match players.
    level: Show level, XP, and next-level progress.
    papi: Show PlaceholderAPI soft-dependency status.
    recipes: Open the custom recipe viewer.
    recipe: Open the custom recipe viewer.
    revive: Revive an eliminated player.
    lobbygame: Start or manage lobby minigames.
