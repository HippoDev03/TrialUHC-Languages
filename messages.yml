    level: "<#f4d35e><bold>/uhc level</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/uhc level [player]</#93c5fd> <#7b8aa0>- show level, experience and progress</#7b8aa0>"
    experience: "<#f4d35e><bold>/admin player xp</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/admin player xp <player|pattern> set <amount></#93c5fd> <#7b8aa0>- set total XP</#7b8aa0><newline> <#93c5fd>/admin player xp <player|pattern> add|remove <amount></#93c5fd> <#7b8aa0>- change XP</#7b8aa0><newline> <#93c5fd>/admin player xp <player|pattern> setlevel <level></#93c5fd> <#7b8aa0>- set the level</#7b8aa0><newline> <#64748b>100 XP = 1 level · * matches any characters, e.g. HippoDev_*</#64748b>"
    revive: "<#f4d35e><bold>/revive</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/revive <player></#93c5fd> <#7b8aa0>- bring an eliminated player back</#7b8aa0>"
    lobbygame: "<#f4d35e><bold>/admin lobby games</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/admin lobby games start <game></#93c5fd> <#7b8aa0>- math, unscramble, type, trivia, number, reaction, treasure, potato</#7b8aa0><newline> <#93c5fd>/admin lobby games stop</#93c5fd> <#7b8aa0>- stop the running game</#7b8aa0><newline> <#93c5fd>/admin lobby games word <add|remove|list> [word]</#93c5fd> <#7b8aa0>- edit the unscramble word list</#7b8aa0><newline> <#93c5fd>/admin lobby games parkour <setstart|addcheckpoint|removecheckpoint|setfinish|clear|resettimes|top></#93c5fd> <#7b8aa0>- set up the parkour</#7b8aa0><newline> <#93c5fd>/admin lobby games range <setlane|removelane|addstray|removestray|addtarget|removetarget|area1|area2|cleararea|list|top> [lane]</#93c5fd> <#7b8aa0>- set up the shooting range</#7b8aa0><newline> <#93c5fd>/admin lobby games spleef|tntrun <pos1|pos2|save|setjoin|info|start|stop|clear></#93c5fd> <#7b8aa0>- set up Spleef / TNT Run</#7b8aa0>"
    pm: "<#f4d35e><bold>/msg</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/msg <player> <message></#93c5fd> <#7b8aa0>- send a private message</#7b8aa0>"
    reply: "<#f4d35e><bold>/r</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/r <message></#93c5fd> <#7b8aa0>- answer your last private message</#7b8aa0>"
    profile: "<#f4d35e><bold>/profile</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/profile [player]</#93c5fd> <#7b8aa0>- show a profile</#7b8aa0><newline> <#93c5fd>/profile list [page]</#93c5fd> <#7b8aa0>- list stored profiles</#7b8aa0>"
    world:
      root: "<#f4d35e><bold>/world</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/world list | current</#93c5fd> <#7b8aa0>- list worlds / show the game world</#7b8aa0><newline> <#93c5fd>/world gen [world]</#93c5fd> <#7b8aa0>- generate a game world</#7b8aa0><newline> <#93c5fd>/world load|unload <world></#93c5fd> <#7b8aa0>- load or unload a world</#7b8aa0><newline> <#93c5fd>/world select <world></#93c5fd> <#7b8aa0>- use a world for the match</#7b8aa0><newline> <#93c5fd>/world tp [world]</#93c5fd> <#7b8aa0>- go to a world</#7b8aa0><newline> <#93c5fd>/world preload [world] [radius]</#93c5fd> <#7b8aa0>- pregenerate with Chunky</#7b8aa0><newline> <#93c5fd>/world regen [world] | delete <world></#93c5fd> <#7b8aa0>- regenerate / delete a world</#7b8aa0><newline> <#93c5fd>/world seed save [name] | list | remove <name></#93c5fd> <#7b8aa0>- save the game world's seed / saved seeds</#7b8aa0><newline> <#93c5fd>/world clean</#93c5fd> <#7b8aa0>- delete all generated uhc_ worlds</#7b8aa0>"
      load: "<#f4d35e><bold>/world load</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/world load <world></#93c5fd> <#7b8aa0>- load a world folder</#7b8aa0>"
      unload: "<#f4d35e><bold>/world unload</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/world unload <world></#93c5fd> <#7b8aa0>- unload a world</#7b8aa0>"
      tp: "<#f4d35e><bold>/world tp</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/world tp [world]</#93c5fd> <#7b8aa0>- go to a world (default: the game world)</#7b8aa0>"
      preload: "<#f4d35e><bold>/world preload</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/world preload [world] [radius]</#93c5fd> <#7b8aa0>- pregenerate with Chunky</#7b8aa0>"
      seed: "<#f4d35e><bold>/world seed</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/world seed save [name]</#93c5fd> <#7b8aa0>- save the seed of the game world (or the one you're previewing)</#7b8aa0><newline> <#93c5fd>/world seed list</#93c5fd> <#7b8aa0>- saved seeds (click one to generate it)</#7b8aa0><newline> <#93c5fd>/world seed remove <name></#93c5fd> <#7b8aa0>- forget a saved seed</#7b8aa0><newline> <#64748b>Generate one with /admin world gen seed=<name>, or seed=saved for a random saved seed.</#64748b>"
    border: "<#f4d35e><bold>/admin world border</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/admin world border info</#93c5fd> <#7b8aa0>- current size and center</#7b8aa0><newline> <#93c5fd>/admin world border set <size></#93c5fd> <#7b8aa0>- set the size now</#7b8aa0><newline> <#93c5fd>/admin world border center <x> <z></#93c5fd> <#7b8aa0>- move the center</#7b8aa0><newline> <#93c5fd>/admin world border shrink <size> <seconds></#93c5fd> <#7b8aa0>- shrink over time</#7b8aa0><newline> <#93c5fd>/admin world border reset</#93c5fd> <#7b8aa0>- back to the configured size</#7b8aa0>"
    announce: "<#f4d35e><bold>/staff chat announce</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/staff chat announce <message></#93c5fd> <#7b8aa0>- big broadcast to everyone</#7b8aa0><newline> <#64748b>| = new line · [en] … [zh_tw] … shows each player their language</#64748b>"
    heal: "<#f4d35e><bold>/heal</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/heal [player]</#93c5fd> <#7b8aa0>- full health and hunger (* = everyone)</#7b8aa0>"
    invsee: "<#f4d35e><bold>/staff player invsee</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/staff player invsee <player></#93c5fd> <#7b8aa0>- open a player's inventory</#7b8aa0>"
    freeze: "<#f4d35e><bold>/staff player freeze</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/staff player freeze <player></#93c5fd> <#7b8aa0>- stop a player from moving (* = everyone)</#7b8aa0>"
    unfreeze: "<#f4d35e><bold>/staff player unfreeze</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/staff player unfreeze <player></#93c5fd> <#7b8aa0>- let a frozen player move again</#7b8aa0>"
    preloadworld: "<#f4d35e><bold>/admin world preload</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/admin world preload [radius]</#93c5fd> <#7b8aa0>- pregenerate the game world</#7b8aa0><newline> <#93c5fd>/admin world preload status | stop</#93c5fd> <#7b8aa0>- progress / stop the preload</#7b8aa0>"
