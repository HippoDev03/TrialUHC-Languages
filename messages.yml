"tutorial.offer.title": "<#f4d35e><bold>Welcome to TrialUHC!</bold></#f4d35e>"
"tutorial.offer.body": "<#cbd5e1>First time here? A short camera tour shows you around the lobby and explains how a match works (about 1½ minutes). Sneak twice to leave any time.</#cbd5e1>"
"tutorial.offer.yes": "<#6dd3a0>Show me</#6dd3a0>"
