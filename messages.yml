usage:
  uhc:
    root: "<#f4d35e><bold>/uhc</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/uhc help [page]</#93c5fd> <#7b8aa0>- every command you can use</#7b8aa0><newline> <#93c5fd>/uhc level [player]</#93c5fd> <#7b8aa0>- level and experience</#7b8aa0><newline> <#93c5fd>/uhc recipes</#93c5fd> <#7b8aa0>- custom crafting recipes</#7b8aa0><newline> <#64748b>Admin tools: /admin · staff tools: /staff help</#64748b>"
