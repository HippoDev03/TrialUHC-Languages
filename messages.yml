"lb-hologram.usage": "<#f4d35e><bold>/admin lobby hologram</bold></#f4d35e> <#7b8aa0>usage:</#7b8aa0><newline> <#93c5fd>/admin lobby hologram set <stat></#93c5fd> <#7b8aa0>- put the leaderboard where you stand</#7b8aa0><newline> <#93c5fd>/admin lobby hologram item <stat></#93c5fd> <#7b8aa0>- use the item in your hand as its icon</#7b8aa0><newline> <#93c5fd>/admin lobby hologram size <stat> <width> <height></#93c5fd> <#7b8aa0>- resize its board (default 5 x 4, rules 8 x 4)</#7b8aa0><newline> <#93c5fd>/admin lobby hologram remove <stat></#93c5fd> <#7b8aa0>- remove the leaderboard</#7b8aa0><newline> <#93c5fd>/admin lobby hologram list</#93c5fd> <#7b8aa0>- show every leaderboard (click one to teleport)</#7b8aa0><newline> <#93c5fd>/admin lobby hologram show</#93c5fd> <#7b8aa0>- outline the click boxes with particles</#7b8aa0><newline> <#93c5fd>/admin lobby hologram toggle [all|text|frames]</#93c5fd> <#7b8aa0>- hide or show the boards (or only their text / frames) just for you, e.g. to compare FPS</#7b8aa0><newline> <#93c5fd>/admin lobby hologram client [player]</#93c5fd> <#7b8aa0>- what a player's game sends: version, brand and mod channels</#7b8aa0><newline> <#7b8aa0>Use <#93c5fd>rules</#93c5fd>, <#93c5fd>activities</#93c5fd>, <#93c5fd>links</#93c5fd> or <#93c5fd>clans</#93c5fd> as the stat to place the server rules board, the activity schedule, the links board or the top clans board.</#7b8aa0>"
