  "usage": "<#f4d35e><bold>/admin arena</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/admin arena generate <名前> [colosseum|forest|ruins]</#93c5fd> <#7b8aa0>- スポーン付きのアリーナを建設</#7b8aa0><newline> <#93c5fd>/admin arena pos1 | pos2</#93c5fd> <#7b8aa0>- 立っている場所を角として選択</#7b8aa0><newline> <#93c5fd>/admin arena create <名前></#93c5fd> <#7b8aa0>- 選択範囲をアリーナとして保存</#7b8aa0><newline> <#93c5fd>/admin arena import <名前> <schematic></#93c5fd> <#7b8aa0>- WorldEditのschematicを使う</#7b8aa0><newline> <#93c5fd>/admin arena paste <名前></#93c5fd> <#7b8aa0>- ここに設置して編集</#7b8aa0><newline> <#93c5fd>/admin arena addspawn | autospawns | clearspawns <名前></#93c5fd> <#7b8aa0>- スポーン地点を設定</#7b8aa0><newline> <#93c5fd>/admin arena use <name|random|off></#93c5fd> <#7b8aa0>- ミートアップ用のアリーナ</#7b8aa0><newline> <#93c5fd>/admin arena list | info <名前> | delete <名前></#93c5fd> <#7b8aa0>- アリーナを管理</#7b8aa0>"
