  "uhc":
    "root": "<#f4d35e><bold>/uhc</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/uhc help [ページ]</#93c5fd> <#7b8aa0>- 使えるコマンド一覧</#7b8aa0><newline> <#93c5fd>/uhc level [プレイヤー]</#93c5fd> <#7b8aa0>- レベルと経験値</#7b8aa0><newline> <#93c5fd>/uhc recipes</#93c5fd> <#7b8aa0>- カスタムレシピ</#7b8aa0><newline> <#64748b>管理ツール：/admin · スタッフツール：/staff help</#64748b>"
    "kill": "<#f4d35e><bold>/kill</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/kill <プレイヤー|セレクター></#93c5fd> <#7b8aa0>- プレイヤーを脱落させる（* = 生存者全員）</#7b8aa0>"
    "level": "<#f4d35e><bold>/uhc level</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/uhc level [プレイヤー]</#93c5fd> <#7b8aa0>- レベル、経験値、進捗を表示</#7b8aa0>"
    "experience": "<#f4d35e><bold>/admin experience</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/admin experience <プレイヤー|パターン> set <量></#93c5fd> <#7b8aa0>- 合計XPを設定</#7b8aa0><newline> <#93c5fd>/admin experience <プレイヤー|パターン> add|remove <量></#93c5fd> <#7b8aa0>- XPを増減</#7b8aa0><newline> <#93c5fd>/admin experience <プレイヤー|パターン> setlevel <レベル></#93c5fd> <#7b8aa0>- レベルを設定</#7b8aa0><newline> <#64748b>100 XP = 1レベル · * は任意の文字列（例：HippoDev_*）</#64748b>"
    "revive": "<#f4d35e><bold>/revive</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/revive <プレイヤー></#93c5fd> <#7b8aa0>- 脱落したプレイヤーを復活</#7b8aa0>"
    "lobbygame": "<#f4d35e><bold>/admin lobbygame</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/admin lobbygame start <ゲーム></#93c5fd> <#7b8aa0>- math, unscramble, type, trivia, number, reaction, treasure, potato</#7b8aa0><newline> <#93c5fd>/admin lobbygame stop</#93c5fd> <#7b8aa0>- 進行中のゲームを停止</#7b8aa0><newline> <#93c5fd>/admin lobbygame word <add|remove|list> [単語]</#93c5fd> <#7b8aa0>- 並べ替え単語リストを編集</#7b8aa0><newline> <#93c5fd>/admin lobbygame parkour <setstart|addcheckpoint|removecheckpoint|setfinish|clear|resettimes|top></#93c5fd> <#7b8aa0>- パルクールを設定</#7b8aa0><newline> <#93c5fd>/admin lobbygame range <setlane|removelane|addstray|removestray|addtarget|removetarget|area1|area2|cleararea|list|top> [レーン]</#93c5fd> <#7b8aa0>- 射撃場を設定</#7b8aa0><newline> <#93c5fd>/admin lobbygame spleef|tntrun <pos1|pos2|save|setjoin|info|start|stop|clear></#93c5fd> <#7b8aa0>- スプリーフ／TNTランを設定</#7b8aa0>"
    "pm": "<#f4d35e><bold>/msg</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/msg <プレイヤー> <メッセージ></#93c5fd> <#7b8aa0>- プライベートメッセージを送る</#7b8aa0>"
    "reply": "<#f4d35e><bold>/r</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/r <メッセージ></#93c5fd> <#7b8aa0>- 最後のプライベートメッセージに返信</#7b8aa0>"
    "profile": "<#f4d35e><bold>/profile</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/profile [プレイヤー]</#93c5fd> <#7b8aa0>- プロフィールを表示</#7b8aa0><newline> <#93c5fd>/profile list [ページ]</#93c5fd> <#7b8aa0>- 保存されたプロフィール一覧</#7b8aa0>"
    "world":
      "root": "<#f4d35e><bold>/world</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/world list | current</#93c5fd> <#7b8aa0>- ワールド一覧／ゲームワールドを表示</#7b8aa0><newline> <#93c5fd>/world gen [ワールド]</#93c5fd> <#7b8aa0>- ゲームワールドを生成</#7b8aa0><newline> <#93c5fd>/world load|unload <ワールド></#93c5fd> <#7b8aa0>- ワールドを読み込み／アンロード</#7b8aa0><newline> <#93c5fd>/world select <ワールド></#93c5fd> <#7b8aa0>- 試合に使うワールドを選ぶ</#7b8aa0><newline> <#93c5fd>/world tp [ワールド]</#93c5fd> <#7b8aa0>- ワールドへ移動</#7b8aa0><newline> <#93c5fd>/world preload [ワールド] [半径]</#93c5fd> <#7b8aa0>- Chunkyで事前生成</#7b8aa0><newline> <#93c5fd>/world regen [ワールド] | delete <ワールド></#93c5fd> <#7b8aa0>- ワールドを再生成／削除</#7b8aa0><newline> <#93c5fd>/world seed save [名前] | list | remove <名前></#93c5fd> <#7b8aa0>- ゲームワールドのシードを保存／保存済みシード</#7b8aa0><newline> <#93c5fd>/world clean</#93c5fd> <#7b8aa0>- 生成された uhc_ ワールドをすべて削除</#7b8aa0>"
      "load": "<#f4d35e><bold>/world load</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/world load <ワールド></#93c5fd> <#7b8aa0>- ワールドフォルダを読み込む</#7b8aa0>"
      "unload": "<#f4d35e><bold>/world unload</bold></#f4d35e> <#7b8aa0>使い方：</#7b8aa0><newline> <#93c5fd>/world unload <ワールド></#93c5fd> <#7b8aa0>- ワールドをアンロード</#7b8aa0>"
