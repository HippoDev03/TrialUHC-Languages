"tutorial.stop.welcome.title": "<#f4d35e><bold>歡迎來到試煉UHC</bold></#f4d35e>"
"tutorial.stop.welcome.subtitle": "<#cbd5e1>快速導覽，按兩下潛行可離開</#cbd5e1>"
"tutorial.stop.welcome.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>歡迎來到試煉UHC</bold></#f4d35e><newline><#cbd5e1>這裡是大廳，每場比賽之間皆在此等候。接下來將帶您參觀各處，約需一分半鐘。</#cbd5e1>"
"tutorial.stop.hotbar.title": "<#f4d35e><bold>您的快捷欄</bold></#f4d35e>"
"tutorial.stop.hotbar.subtitle": "<#cbd5e1>所有功能一鍵即達</#cbd5e1>"
"tutorial.stop.hotbar.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>您的快捷欄</bold></#f4d35e><newline><#cbd5e1>左側為遊戲設定、情境與隊伍；右側為個人檔案與排行榜。本教學即物品欄中的望遠鏡。<#93c5fd>/menu</#93c5fd> 開啟快捷選單，<#93c5fd>/settings</#93c5fd> 為您的個人設定。</#cbd5e1>"
"tutorial.stop.parkour.title": "<#f4d35e><bold>跑酷</bold></#f4d35e>"
"tutorial.stop.parkour.subtitle": "<#cbd5e1>跑完全程，與時間競賽</#cbd5e1>"
"tutorial.stop.parkour.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>跑酷</bold></#f4d35e><newline><#cbd5e1>踩上起點的壓力板即開始，檢查點會儲存您的進度。最佳成績將登上跑酷排行榜。<#93c5fd>/parkour</#93c5fd></#cbd5e1>"
"tutorial.stop.spleef.title": "<#f4d35e><bold>掘一死戰</bold></#f4d35e>"
"tutorial.stop.spleef.subtitle": "<#cbd5e1>把對手腳下的地板挖掉</#cbd5e1>"
"tutorial.stop.spleef.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>掘一死戰</bold></#f4d35e><newline><#cbd5e1>挖掉對手腳下的地板，最後仍站立的玩家獲勝。使用 <#93c5fd>/spleef</#93c5fd> 加入。</#cbd5e1>"
"tutorial.stop.tnt-run.title": "<#f4d35e><bold>TNT 跑跑</bold></#f4d35e>"
"tutorial.stop.tnt-run.subtitle": "<#cbd5e1>切勿停下腳步</#cbd5e1>"
"tutorial.stop.tnt-run.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>TNT 跑跑</bold></#f4d35e><newline><#cbd5e1>您跑過的地板會消失，最後留在場上的玩家獲勝。使用 <#93c5fd>/tntrun</#93c5fd> 加入。</#cbd5e1>"
"tutorial.stop.range.title": "<#f4d35e><bold>射擊場</bold></#f4d35e>"
"tutorial.stop.range.subtitle": "<#cbd5e1>練習弓術</#cbd5e1>"
"tutorial.stop.range.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>射擊場</bold></#f4d35e><newline><#cbd5e1>在時間結束前射中出現的標靶即可得分。<#93c5fd>/range</#93c5fd></#cbd5e1>"
"tutorial.stop.leaderboards.title": "<#f4d35e><bold>排行榜</bold></#f4d35e>"
"tutorial.stop.leaderboards.subtitle": "<#cbd5e1>伺服器最強的玩家</#cbd5e1>"
"tutorial.stop.leaderboards.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>排行榜</bold></#f4d35e><newline><#cbd5e1>涵蓋勝場、擊殺與 K/D，並分為總計、每月、每週與每日。點擊看板即可切換。<#93c5fd>/leaderboard</#93c5fd> <#93c5fd>/profile</#93c5fd></#cbd5e1>"
"tutorial.stop.podium.title": "<#f4d35e><bold>頒獎台</bold></#f4d35e>"
"tutorial.stop.podium.subtitle": "<#cbd5e1>贏家登台之處</#cbd5e1>"
"tutorial.stop.podium.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>頒獎台</bold></#f4d35e><newline><#cbd5e1>每場比賽結束後，鏡頭將移至此處：先頒發各項獎項，再由前三名登上頒獎台。</#cbd5e1>"
"tutorial.stop.pvp.title": "<#f4d35e><bold>大廳 PvP 與練習場</bold></#f4d35e>"
"tutorial.stop.pvp.subtitle": "<#cbd5e1>等候期間也可對戰</#cbd5e1>"
"tutorial.stop.pvp.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>大廳 PvP 與練習場</bold></#f4d35e><newline><#cbd5e1>將快捷欄中的劍持於手上 3 秒，即可與同樣開啟 PvP 的玩家對戰。<#93c5fd>/practice</#93c5fd> 將帶您前往配有完整套裝的練習場。</#cbd5e1>"
"tutorial.stop.teams.title": "<#f4d35e><bold>隊伍、投票與套裝</bold></#f4d35e>"
"tutorial.stop.teams.subtitle": "<#cbd5e1>為下一場比賽做準備</#cbd5e1>"
"tutorial.stop.teams.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>隊伍、投票與套裝</bold></#f4d35e><newline><#cbd5e1>使用 <#93c5fd>/team</#93c5fd> 建立或加入隊伍，使用 <#93c5fd>/vote</#93c5fd> 投票選擇下一場的情境，使用 <#93c5fd>/kit</#93c5fd> 查看開場套裝。</#cbd5e1>"
"tutorial.stop.game-goal.title": "<#f4d35e><bold>比賽玩法</bold></#f4d35e>"
"tutorial.stop.game-goal.subtitle": "<#cbd5e1>僅有一條命，且不會自然回血。</#cbd5e1>"
"tutorial.stop.game-goal.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>比賽玩法</bold></#f4d35e><newline><#cbd5e1>UHC 類似極限模式：生命值不會自然回復，且僅有一條命。最後存活的玩家或隊伍獲勝。</#cbd5e1>"
"tutorial.stop.game-flow.title": "<#f4d35e><bold>傳送與和平時間</bold></#f4d35e>"
"tutorial.stop.game-flow.subtitle": "<#cbd5e1>前 10 分鐘無法 PvP</#cbd5e1>"
"tutorial.stop.game-flow.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>傳送與和平時間</bold></#f4d35e><newline><#cbd5e1>所有玩家將被分散至地圖各處。前 10 分鐘無法 PvP，可趁此時挖礦、收集資源並製作裝備。第 10 分鐘時所有玩家將回滿血一次。</#cbd5e1>"
"tutorial.stop.game-border.title": "<#f4d35e><bold>邊界與殊死戰</bold></#f4d35e>"
"tutorial.stop.game-border.subtitle": "<#cbd5e1>地圖將逐漸縮小</#cbd5e1>"
"tutorial.stop.game-border.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>邊界與殊死戰</bold></#f4d35e><newline><#cbd5e1>自第 30 分鐘起，邊界將向中心縮小。一小時後，存活的玩家將進入殊死戰一決勝負。</#cbd5e1>"
"tutorial.stop.game-healing.title": "<#f4d35e><bold>活下去</bold></#f4d35e>"
"tutorial.stop.game-healing.subtitle": "<#cbd5e1>金蘋果與金頭顱</#cbd5e1>"
"tutorial.stop.game-healing.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>活下去</bold></#f4d35e><newline><#cbd5e1>使用金蘋果補血。被擊殺的玩家會掉落頭顱，以 8 個金錠圍住即可製作金頭顱。<#93c5fd>/recipe</#93c5fd></#cbd5e1>"
"tutorial.stop.game-after.title": "<#f4d35e><bold>陣亡之後</bold></#f4d35e>"
"tutorial.stop.game-after.subtitle": "<#cbd5e1>先旁觀，再參加下一場</#cbd5e1>"
"tutorial.stop.game-after.text": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#f4d35e><bold>陣亡之後</bold></#f4d35e><newline><#cbd5e1>比賽結束前您將維持旁觀者身分，在此之前大廳將保持鎖定。可隨時再次觀看：<#93c5fd>/tutorial rules</#93c5fd></#cbd5e1>"
"tutorial.book.1.title": "<#f4d35e><bold>目標</bold></#f4d35e>"
"tutorial.book.1.text": "<#cbd5e1>UHC 類似極限模式。您僅有一條命，且生命值不會自然回復，即使飢餓值全滿亦然。最後存活的玩家或隊伍獲勝。</#cbd5e1>"
"tutorial.book.2.title": "<#f4d35e><bold>加入與隊伍</bold></#f4d35e>"
"tutorial.book.2.text": "<#cbd5e1>比賽從大廳開始。參加隊伍賽時，請使用 /team 建立或加入隊伍；/tm 與隊友聊天，/tc 分享座標。尚無隊伍的玩家將於比賽開始時自動分隊。</#cbd5e1>"
"tutorial.book.3.title": "<#f4d35e><bold>傳送與和平時間</bold></#f4d35e>"
"tutorial.book.3.text": "<#cbd5e1>比賽開始時，所有玩家將被傳送至彼此相隔甚遠的位置。前 10 分鐘無法 PvP，請先挖礦、收集資源並製作裝備。此期間亦不可在其他隊伍附近放置熔岩、火或 TNT。</#cbd5e1>"
"tutorial.book.4.title": "<#f4d35e><bold>最終回血與邊界</bold></#f4d35e>"
"tutorial.book.4.text": "<#cbd5e1>第 10 分鐘時所有玩家將補滿血一次，這也是整場最後一次免費回血。自第 30 分鐘起，邊界將向中心縮小，最終僅剩 100 格寬；位於邊界外的玩家將被拉回。</#cbd5e1>"
"tutorial.book.5.title": "<#f4d35e><bold>殊死戰</bold></#f4d35e>"
"tutorial.book.5.text": "<#cbd5e1>一小時後，仍存活的玩家將被集中至封閉的方塊箱或決戰競技場，直到僅剩一名玩家或一支隊伍為止。</#cbd5e1>"
"tutorial.book.6.title": "<#f4d35e><bold>補血</bold></#f4d35e>"
"tutorial.book.6.text": "<#cbd5e1>金蘋果為主要的補血方式：蘋果來自樹木，金子需靠挖礦取得。被擊殺的玩家會掉落頭顱，在工作台以 8 個金錠圍住即可製作更強的金頭顱。/recipe 可查看伺服器的合成表。</#cbd5e1>"
"tutorial.book.7.title": "<#f4d35e><bold>情境與設定</bold></#f4d35e>"
"tutorial.book.7.text": "<#cbd5e1>情境會改變比賽規則：/scenarios 查看目前啟用的情境，/vote 投票決定下一場的情境。/kit 查看開場套裝，/config 查看比賽設定。主持人可調整本書所列的時間。</#cbd5e1>"
"tutorial.book.8.title": "<#f4d35e><bold>淘汰之後</bold></#f4d35e>"
"tutorial.book.8.text": "<#cbd5e1>被淘汰後，您將以旁觀者身分觀戰至比賽結束，此期間大廳將保持鎖定；比賽中途加入的玩家同樣為旁觀者。您的勝場、擊殺與經驗皆會記錄於 /profile 及排行榜。查看規則：/rules，檢舉作弊：/report。</#cbd5e1>"
"tutorial.only-lobby": "僅可於大廳且無比賽進行時觀看教學。"
"tutorial.busy": "請先結束目前的活動（大廳小遊戲、練習場、旁觀或管理模式）。"
"tutorial.unavailable": "教學目前無法使用：尚未設定大廳重生點。"
"tutorial.started": "<#93c5fd>ⓘ</#93c5fd> <dark_gray>»</dark_gray> <#cbd5e1>教學開始。按<white>兩下潛行</white>即可離開。</#cbd5e1>"
