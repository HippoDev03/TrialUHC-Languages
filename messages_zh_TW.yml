config-menu-desc-game-bed-explosions: "床在下界／終界、重生錨在下界以外會像原版一樣爆炸。"
config-menu-label-game-generation: "比賽世界地形"
config-menu-desc-game-generation: "新產生的比賽世界使用的地形類型：NORMAL、AMPLIFIED、LARGE_BIOMES、FLAT 或 VOID。"
config-menu-label-game-invisibility-potions: "隱形藥水"
config-menu-desc-game-invisibility-potions: "隱形藥水可以使用（飲用、飛濺、滯留或藥水箭）。"
config-menu-label-game-no-baby-animals: "禁止繁殖動物"
config-menu-desc-game-no-baby-animals: "禁止動物繁殖，避免掛機繁殖場。"
config-menu-label-game-no-nametag: "隱藏名牌"
config-menu-desc-game-no-nametag: "整場比賽永久隱藏所有玩家的名牌。"
config-menu-label-game-ready-check-timeout-seconds: "準備檢查時限"
config-menu-desc-game-ready-check-timeout-seconds: "玩家回應準備檢查的秒數。"
config-menu-label-game-speed-potions: "迅捷藥水"
config-menu-desc-game-speed-potions: "迅捷藥水可以使用（飲用、飛濺、滯留或藥水箭）。"
config-menu-label-game-strength-potions: "力量藥水"
config-menu-desc-game-strength-potions: "力量藥水可以使用（飲用、飛濺、滯留或藥水箭）。"
config-menu-label-lobby-generation: "大廳世界地形"
config-menu-desc-lobby-generation: "需要建立大廳世界時使用的地形類型：VOID、NORMAL、FLAT、AMPLIFIED 或 LARGE_BIOMES。"
config-menu-label-meetup-arena: "決戰競技場"
config-menu-desc-meetup-arena: "決戰要在哪個已儲存的競技場進行（見 /arena）。留空 = 開放世界，\"random\" = 隨機競技場。"
config-menu-label-meetup-border-size: "決戰邊界大小"
config-menu-desc-meetup-border-size: "決戰開始時的邊界大小，之後會縮小到最終邊界大小。"
config-menu-label-meetup-enabled: "啟用決戰"
config-menu-desc-meetup-enabled: "殊死戰改在已儲存的競技場（meetup.arena）進行，而不是基岩箱。"
config-menu-label-meetup-kit: "決戰裝備"
config-menu-desc-meetup-kit: "決戰開始時給每位玩家隨機的鐵／鑽石盔甲與一把劍。"
config-menu-label-ui-arrow-health: "箭矢命中血量"
config-menu-desc-ui-arrow-health: "用投射物命中目標時，在射擊者的動作列顯示目標剩餘血量。"
config-menu-label-ui-full-width-tab: "全寬 Tab 列表"
config-menu-desc-ui-full-width-tab: "全寬 Tab：先顯示你的隊伍，再顯示其他隊伍與觀戰者，最後一欄是你的數據。"
config-menu-label-ui-tab-health-mode: "Tab 血量顯示"
