# Command usage
usage:
  uhc:
    root: "<#f4d35e>使用方法: /uhc <pause|resume|start|forcestart|stop|state|setlobby|skipGracePeriod|skipphase|reload|checkready|reset|gen [world] [terrain=normal|flat|amplified|large_biomes|void] [biome=PLAINS] [generator=Plugin:gen] [hardcore=false] [seed=123]|preloadworld [radius]|kill <player|selector>|level [player]|papi|recipes|revive <player>></#f4d35e>"
    kill: "<#f4d35e>使用方法: /uhc kill <player|selector></#f4d35e>"
    level: "<#f4d35e>使用方法: /uhc level [player]</#f4d35e>"
    experience: "<#f4d35e>使用方法: /uhc experience <玩家|名稱模式> <set|add|remove|setlevel> <數量></#f4d35e> <#7b8aa0>（100 經驗 = 1 級）</#7b8aa0>"
    revive: "<#f4d35e>使用方法: /uhc revive <player></#f4d35e>"
    lobbygame: "<#f4d35e>使用方法: /uhc lobbygame <start <math|unscramble [word]|type|trivia|number|reaction|treasure|potato>|stop|word <add|remove|list> [word]|parkour <setstart|addcheckpoint|removecheckpoint|setfinish|clear|resettimes|top>></#f4d35e>"
    pm: "<#f4d35e>使用方法: /pm <player> <message></#f4d35e>"
    reply: "<#f4d35e>使用方法: /reply <message></#f4d35e>"
    profile: "<#f4d35e>使用方法: /profile [玩家 | list [頁數]]</#f4d35e>"
    world:
      root: "<#f4d35e>使用方法: /world <list|current|gen [world]|load <world>|unload <world>|preload [world] [radius]|select <world>|tp [world]|regen [world]|delete <world>|clean></#f4d35e>"
      load: "<#f4d35e>使用方法: /world load <world></#f4d35e>"
      unload: "<#f4d35e>使用方法: /world unload <world></#f4d35e>"
      tp: "<#f4d35e>使用方法: /world tp [world]</#f4d35e>"
      preload: "<#f4d35e>使用方法: /world preload <status|stop|[world] [radius]></#f4d35e>"
    border: "<#f4d35e>使用方法: /border <info|set <size>|center <x> <z>|shrink <size> <seconds>|reset></#f4d35e>"
    announce: "<#f4d35e>用法：/announce <訊息></#f4d35e> <#7b8aa0>（| 換行；[en] 英文 [zh_tw] 中文 可讓不同語言的玩家看到各自的版本）</#7b8aa0>"
    heal: "<#f4d35e>使用方法: /heal [player]</#f4d35e>"
    freeze: "<#f4d35e>使用方法: /freeze <player></#f4d35e>"
    unfreeze: "<#f4d35e>使用方法: /unfreeze <player></#f4d35e>"
    preloadworld: "<#f4d35e>使用方法: /uhc preloadworld <status|stop|[radius]></#f4d35e>"
    language: "<#f4d35e>使用方法: /language [locale|auto]</#f4d35e>"
    gen: "<#f4d35e>使用方法: /uhc gen [world] [terrain=normal|flat|amplified|large_biomes|void] [biome=PLAINS] [generator=Plugin:id] [biome-provider=Plugin:id] [generator-settings=data] [seed=123] [pack=uhc] [structures=true|false] [hardcore=true|false]</#f4d35e>"
    report: "<#f4d35e>用法:/report <player> <reason></#f4d35e>"
    kit:
      create: "<#f4d35e>用法：/kit create <kit></#f4d35e>"
      edit: "<#f4d35e>用法：/kit edit <kit></#f4d35e>"
      save: "<#f4d35e>用法：/kit save [kit]</#f4d35e>"
    invsee: "<#f4d35e>使用方法: /invsee <玩家></#f4d35e>"
