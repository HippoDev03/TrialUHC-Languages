    reply: "<prefix><#f4d35e>使用方法: /reply <message></#f4d35e>"
    profile: "<prefix><#f4d35e>使用方法: /profile [玩家 | list [頁數]]</#f4d35e>"
    world:
      root: "<prefix><#f4d35e>使用方法: /world <list|current|gen [world]|load <world>|unload <world>|preload [world] [radius]|select <world>|tp [world]|regen [world]|delete <world>|clean></#f4d35e>"
