      unload: "<prefix><#f4d35e>使用方法: /world unload <world></#f4d35e>"
      tp: "<prefix><#f4d35e>使用方法: /world tp [world]</#f4d35e>"
      preload: "<prefix><#f4d35e>使用方法: /world preload <status|stop|[world] [radius]></#f4d35e>"
    border: "<prefix><#f4d35e>使用方法: /border <info|set <size>|center <x> <z>|shrink <size> <seconds>|reset></#f4d35e>"
    announce: "<prefix><#f4d35e>使用方法: /announce <message></#f4d35e>"
    heal: "<prefix><#f4d35e>使用方法: /heal [player]</#f4d35e>"
