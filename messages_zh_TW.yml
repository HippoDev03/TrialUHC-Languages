    scenario:
      random:
        name: "<bold><#f4d35e>隨機"
        desc: "<#6b7280><i>比賽開始時隨機挑選一組情境。</i>"
      chest:
        name: "<bold><#f4d35e>死亡寶箱"
        desc: "<#6b7280><i>擊殺玩家後，對方的戰利品會放進死亡地點的箱子裡。</i>"
      time-bomb:
        name: "<bold><#f4d35e>定時炸彈"
        desc: "<#6b7280><i>擊殺玩家後，對方的戰利品會放進箱子裡，箱子會在設定的秒數後爆炸。</i>"
      safe-loot:
        name: "<bold><#f4d35e>安全戰利品"
        desc: "<#6b7280><i>啟用定時炸彈時，只有擊殺者能打開箱子。</i>"
      no-clean:
        name: "<bold><#f4d35e>防搶殺"
        desc: "<#6b7280><i>擊殺玩家後，你會在設定的秒數內無敵。</i>"
      golden-retriever:
        name: "<bold><#f4d35e>黃金獵犬"
        desc: "<#6b7280><i>玩家死亡時掉落 1 顆金頭顱。</i>"
      bleedingsweets:
        name: "<bold><#f4d35e>流血糖果"
        desc: "<#6b7280><i>玩家死亡時掉落 1 顆鑽石、5 個金錠、16 支箭和 1 條線。</i>"
      bookception:
        name: "<bold><#f4d35e>書中有書"
        desc: "<#6b7280><i>玩家死亡時，死亡地點會出現一本隨機附魔書。</i>"
      zombies:
        name: "<bold><#f4d35e>殭屍"
        desc: "<#6b7280><i>玩家死亡時，死亡地點會生成一隻殭屍。</i>"
      betazombies:
        name: "<bold><#f4d35e>Beta 殭屍"
        desc: "<#6b7280><i>殭屍被擊殺時會掉落羽毛。（需要「殭屍」情境）</i>"
      double-ores:
        name: "<bold><#f4d35e>雙倍礦物"
        desc: "<#6b7280><i>挖掘任何礦石都會掉落 2 倍的數量。</i>"
      triple-ores:
        name: "<bold><#f4d35e>三倍礦物"
        desc: "<#6b7280><i>挖掘任何礦石都會掉落 3 倍的數量。</i>"
      double-or-nothing:
        name: "<bold><#f4d35e>加倍或歸零"
        desc: "<#6b7280><i>挖掘鐵、金或鑽石礦時：50% 機率掉落 2 倍，否則什麼都不會掉。</i>"
      blood-diamonds:
        name: "<bold><#f4d35e>血鑽石"
        desc: "<#6b7280><i>每挖一個鑽石礦就會扣半顆心。</i>"
      blood-gold:
        name: "<bold><#f4d35e>血金"
        desc: "<#6b7280><i>每挖一個金礦就會扣半顆心。</i>"
      broadcaster:
        name: "<bold><#f4d35e>廣播者"
        desc: "<#6b7280><i>挖到金礦或鑽石礦時，有機率公開你的座標並讓你發光。</i>"
      limitations:
        name: "<bold><#f4d35e>資源限制"
        desc: "<#6b7280><i>每位玩家能挖掘的鑽石、金與鐵數量都有上限。</i>"
      diamond-less:
        name: "<bold><#f4d35e>無鑽石"
        desc: "<#6b7280><i>無法挖掘鑽石，改為每擊殺一名玩家獲得 1 顆鑽石。</i>"
      gold-less:
        name: "<bold><#f4d35e>無金礦"
        desc: "<#6b7280><i>無法挖掘金礦，改為每擊殺一名玩家獲得 1 個金錠。</i>"
      iron-less:
        name: "<bold><#f4d35e>無鐵礦"
        desc: "<#6b7280><i>無法挖掘鐵礦，改為每擊殺一名玩家獲得 8 個鐵錠。</i>"
      woodlife:
        name: "<bold><#f4d35e>木頭人生"
        desc: "<#6b7280><i>停用煤炭。</i>"
      nodiamondarmor:
        name: "<bold><#f4d35e>禁用鑽石盔甲"
        desc: "<#6b7280><i>玩家無法合成鑽石盔甲。</i>"
      no-enchant:
        name: "<bold><#f4d35e>禁止附魔"
        desc: "<#6b7280><i>停用附魔台與鐵砧。</i>"
      bare-bones:
        name: "<bold><#f4d35e>極簡生存"
        desc: "<#6b7280><i>停用附魔與鐵砧，且無法合成金蘋果。玩家死亡時掉落 1 顆鑽石、2 顆金蘋果、32 支箭和 2 條線。</i>"
      limited-enchants:
        name: "<bold><#f4d35e>限定附魔台"
        desc: "<#6b7280><i>無法合成附魔台。地圖上預先放置的附魔台位於 0,0 與四個象限角落（±500）。</i>"
      infinite-enchant:
        name: "<bold><#f4d35e>無限附魔"
        desc: "<#6b7280><i>無限附魔。玩家開局即獲得附魔台、鐵砧、書櫃與 30k 經驗值。</i>"
      blood-enchants:
        name: "<bold><#f4d35e>血之附魔"
        desc: "<#6b7280><i>每花費一級附魔等級就會扣半顆心。</i>"
      better-enchant:
        name: "<bold><#f4d35e>附魔書回收"
        desc: "<#6b7280><i>在鐵砧使用附魔書時，已套用到物品上的附魔會從書上扣除；附魔全部用完後，書會變回普通的書。</i>"
      limitedp4:
        name: "<bold><#f4d35e>限制保護 IV"
        desc: "<#6b7280><i>每位玩家只能為一件物品附上保護 IV。</i>"
      exposure:
        name: "<bold><#f4d35e>暴露"
        desc: "<#6b7280><i>合成附魔台會將你傳送到地表，並給予 1 分鐘的挖掘疲勞。</i>"
      hidden-enchant:
        name: "<bold><#f4d35e>隱藏附魔"
        desc: "<#6b7280><i>附魔台不會顯示附魔名稱，只能盲附。</i>"
      grindstone-less:
        name: "<bold><#f4d35e>無砂輪"
        desc: "<#6b7280><i>停用砂輪，玩家無法移除附魔。</i>"
      blood-grindstone:
        name: "<bold><#f4d35e>血之砂輪"
        desc: "<#6b7280><i>使用砂輪時，每移除一級附魔就會扣半顆心。</i>"
      hastey-boys:
        name: "<bold><#f4d35e>效率小子"
        desc: "<#6b7280><i>合成的挖掘工具自帶效率 III，砂輪無法移除工具上的效率。</i>"
      hastey-boys-lite:
        name: "<bold><#f4d35e>效率小子（輕量版）"
        desc: "<#6b7280><i>合成的挖掘工具自帶效率 I，砂輪無法移除工具上的效率。</i>"
      op-hastey-boys:
        name: "<bold><#f4d35e>超強效率小子"
        desc: "<#6b7280><i>合成的挖掘工具自帶效率 V，砂輪無法移除工具上的效率。</i>"
      carrotcombo:
        name: "<bold><#f4d35e>紅蘿蔔套餐"
        desc: "<#6b7280><i>合成劍時會額外獲得一根附魔紅蘿蔔。</i>"
      bow-nerf:
        name: "<bold><#f4d35e>弓箭削弱"
        desc: "<#6b7280><i>箭矢傷害減少 50%。</i>"
      rod-less:
        name: "<bold><#f4d35e>無釣竿"
        desc: "<#6b7280><i>停用釣竿。</i>"
      bow-less:
        name: "<bold><#f4d35e>無弓"
        desc: "<#6b7280><i>停用弓。</i>"
      sword-less:
        name: "<bold><#f4d35e>無劍"
        desc: "<#6b7280><i>停用劍。</i>"
      horse-less:
        name: "<bold><#f4d35e>無馬"
        desc: "<#6b7280><i>無法馴服馬和驢。</i>"
      fast-obsidian:
        name: "<bold><#f4d35e>快速黑曜石"
        desc: "<#6b7280><i>黑曜石的挖掘速度和石頭一樣快。</i>"
      double-exp:
        name: "<bold><#f4d35e>雙倍經驗"
        desc: "<#6b7280><i>獲得的經驗值加倍。</i>"
      triple-exp:
        name: "<bold><#f4d35e>三倍經驗"
        desc: "<#6b7280><i>獲得的經驗值變為三倍。</i>"
      double-drops:
        name: "<bold><#f4d35e>雙倍掉落"
        desc: "<#6b7280><i>動物與怪物的掉落物加倍。</i>"
      triple-drops:
        name: "<bold><#f4d35e>三倍掉落"
        desc: "<#6b7280><i>動物與怪物的掉落物變為三倍。</i>"
      cut-clean:
        name: "<bold><#f4d35e>自動冶煉"
        desc: "<#6b7280><i>所有原礦與生肉掉落時都會自動冶煉。</i>"
      lucky-leaves:
        name: "<bold><#f4d35e>幸運樹葉"
        desc: "<#6b7280><i>樹葉被破壞或腐爛時，有機率掉落金蘋果（機率可設定）。</i>"
      tree-drops:
        name: "<bold><#f4d35e>樹葉寶藏"
        desc: "<#6b7280><i>樹葉被破壞或腐爛時，可能掉落金（0.5%）、鑽石（0.1%）或羽毛（10%）。</i>"
      flower-power:
        name: "<bold><#f4d35e>花之力"
        desc: "<#6b7280><i>破壞花朵會掉落隨機物品。</i>"
      timber:
        name: "<bold><#f4d35e>一斧倒樹"
        desc: "<#6b7280><i>砍下一塊原木就會砍倒整棵相連的樹（最多 256 塊）。</i>"
      veinminer:
        name: "<bold><#f4d35e>連鎖挖礦"
        desc: "<#6b7280><i>蹲下挖礦時，會一次挖掉所有相連的同種礦石。</i>"
      baldchicken:
        name: "<bold><#f4d35e>禿頭雞"
        desc: "<#6b7280><i>雞不會掉落羽毛，骷髏會掉落 3-5 支箭。</i>"
      bats:
        name: "<bold><#f4d35e>蝙蝠賭局"
        desc: "<#6b7280><i>擊殺蝙蝠：95% 機率獲得金蘋果，5% 機率直接死亡。</i>"
      no-fall-damage:
        name: "<bold><#f4d35e>無摔落傷害"
        desc: "<#6b7280><i>玩家不會受到摔落傷害。</i>"
      fire-less:
        name: "<bold><#f4d35e>無火焰傷害"
        desc: "<#6b7280><i>玩家不會受到火焰或燃燒傷害。</i>"
      absorptionless:
        name: "<bold><#f4d35e>無吸收"
        desc: "<#6b7280><i>沒有吸收愛心，金蘋果與金頭顱只會回血。</i>"
      double-health:
        name: "<bold><#f4d35e>雙倍血量"
        desc: "<#6b7280><i>所有玩家擁有 20 顆心，而不是 10 顆。</i>"
      night-vision:
        name: "<bold><#f4d35e>夜視"
        desc: "<#6b7280><i>所有玩家開局獲得永久夜視。</i>"
      invisibility-protection:
        name: "<bold><#f4d35e>隱身保護"
        desc: "<#6b7280><i>所有玩家開局獲得 5 分鐘隱身。</i>"
      birds:
        name: "<bold><#f4d35e>鳥人"
        desc: "<#6b7280><i>所有玩家都能飛行。</i>"
      noodlejump:
        name: "<bold><#f4d35e>麵條跳"
        desc: "<#6b7280><i>所有玩家開局獲得永久跳躍提升。</i>"
      superheros:
        name: "<bold><#f4d35e>超級英雄"
        desc: "<#6b7280><i>每位玩家獲得一種隨機特殊能力，並停用摔落傷害。</i>"
      everyrose:
        name: "<bold><#f4d35e>玫瑰有刺"
        desc: "<#6b7280><i>每位玩家開局獲得一件附有尖刺 III 的金胸甲。</i>"
      pyro:
        name: "<bold><#f4d35e>縱火狂"
        desc: "<#6b7280><i>玩家開局獲得一本附有火焰 I 與燃燒 I 的附魔書。</i>"
      criple:
        name: "<bold><#f4d35e>跛腳"
        desc: "<#6b7280><i>受到摔落傷害時，會獲得 30 秒的緩速。</i>"
      sky-high:
        name: "<bold><#f4d35e>高空求生"
        desc: "<#6b7280><i>低於設定 Y 座標的玩家每 30 秒會受到 1 顆心的傷害。</i>"
      long-shots:
        name: "<bold><#f4d35e>遠距狙擊"
        desc: "<#6b7280><i>從 50 格以外射中玩家會回復 1 顆心，並造成 1.5 倍傷害。</i>"
      switcheroo:
        name: "<bold><#f4d35e>位置互換"
        desc: "<#6b7280><i>射中玩家時會與對方交換位置。</i>"
      dnd:
        name: "<bold><#f4d35e>請勿打擾"
        desc: "<#6b7280><i>與一名玩家進入戰鬥後，戰鬥結束前只能與該玩家交戰。</i>"
      web-cage:
        name: "<bold><#f4d35e>蛛網牢籠"
        desc: "<#6b7280><i>擊殺玩家後，你會被一圈蜘蛛網包圍。</i>"
      web-limit:
        name: "<bold><#f4d35e>蛛網限制"
        desc: "<#6b7280><i>每位玩家背包裡的蜘蛛網數量有上限。</i>"
      grass-explosion:
        name: "<bold><#f4d35e>草地爆炸"
        desc: "<#6b7280><i>走在草地上有 25% 機率引發爆炸。</i>"
      raining-tnt:
        name: "<bold><#f4d35e>TNT 雨"
        desc: "<#6b7280><i>每隔一段時間（可設定），TNT 會落在 2 名隨機玩家身上。</i>"
      coronavirus:
        name: "<bold><#f4d35e>冠狀病毒"
        desc: "<#6b7280><i>每隔一段時間（可設定），會有一名隨機玩家獲得噁心與中毒效果。</i>"
      bombers:
        name: "<bold><#f4d35e>轟炸機"
        desc: "<#6b7280><i>所有人開局獲得一個不會損壞的打火石，大多數怪物會掉落 TNT。</i>"
      back-packs:
        name: "<bold><#f4d35e>隊伍背包"
        desc: "<#6b7280><i>玩家可以用 /backpack 開啟隊伍共用的背包。</i>"
      extra-inventory:
        name: "<bold><#f4d35e>額外欄位"
        desc: "<#6b7280><i>玩家可以用 /extrainventory 使用額外的儲存空間。</i>"
      nineslot:
        name: "<bold><#f4d35e>九格背包"
        desc: "<#6b7280><i>每位玩家只能使用 9 個物品欄位。</i>"
      benchblitz:
        name: "<bold><#f4d35e>工作台閃電戰"
        desc: "<#6b7280><i>玩家開局獲得 1 個工作台，而且無法再取得更多。</i>"
      gone-fishing:
        name: "<bold><#f4d35e>釣魚去"
        desc: "<#6b7280><i>玩家獲得一支耐久 200 的釣竿和一組鐵砧。</i>"
      puppypower:
        name: "<bold><#f4d35e>狗狗之力"
        desc: "<#6b7280><i>所有玩家獲得一組骨頭、腐肉和狼的生成蛋。</i>"
      build-uhc:
        name: "<bold><#f4d35e>建築 UHC"
        desc: "<#6b7280><i>所有玩家在遊戲開始時獲得一套裝備。</i>"
      soup:
        name: "<bold><#f4d35e>蘑菇湯"
        desc: "<#6b7280><i>右鍵蘑菇燉湯可回復 3.5 顆心。</i>"
      hypixel-heads:
        name: "<bold><#f4d35e>Hypixel 頭顱"
        desc: "<#6b7280><i>右鍵玩家頭顱可獲得 4 秒的回復 III 與 20 秒的速度 II。</i>"
      redvsblue:
        name: "<bold><#f4d35e>紅藍對決"
        desc: "<#6b7280><i>遊戲開始時隨機分成紅、藍兩隊。</i>"
      moles:
        name: "<bold><#f4d35e>內鬼"
        desc: "<#6b7280><i>每隊有一名玩家秘密擔任內鬼，暗中淘汰其他人。</i>"
      anonymous:
        name: "<bold><#f4d35e>匿名"
        desc: "<#6b7280><i>隱藏所有玩家的名稱與外觀。</i>"
      lafs:
        name: "<bold><#f4d35e>自由組隊"
        desc: "<#6b7280><i>比賽開始前，玩家互相右鍵點擊即可組隊。</i>"
      tracker:
        name: "<bold><#f4d35e>追蹤者"
        desc: "<#6b7280><i>所有玩家獲得一個可以追蹤其他玩家的指南針。</i>"
      randomizer:
        name: "<bold><#f4d35e>隨機掉落"
        desc: "<#6b7280><i>每種方塊會依照設定掉落隨機物品。</i>"
      luckyroulette:
        name: "<bold><#f4d35e>幸運輪盤"
        desc: "<#6b7280><i>每 2 分鐘所有玩家都會獲得一個隨機物品。</i>"
      lightsout:
        name: "<bold><#f4d35e>熄燈"
        desc: "<#6b7280><i>比賽期間玩家無法放置火把。</i>"
    'off': "關閉"
    reset: "<#f95738><bold>重置所有情境</bold>"
    reset-lore: "<#7b8aa0>停用所有情境，並將世界設定恢復為預設值。"

