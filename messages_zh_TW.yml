    gen: "<prefix><#f4d35e>使用方法: /uhc gen [world] [terrain=normal|flat|amplified|large_biomes|void] [biome=PLAINS] [generator=Plugin:id] [biome-provider=Plugin:id] [generator-settings=data] [seed=123] [pack=uhc] [structures=true|false] [hardcore=true|false]</#f4d35e>"
    report: "<prefix><#f4d35e>用法:/report <player> <reason></#f4d35e>"
    kit:
      create: "<prefix><#f4d35e>用法：/kit create <kit></#f4d35e>"
      edit: "<prefix><#f4d35e>用法：/kit edit <kit></#f4d35e>"
      save: "<prefix><#f4d35e>用法：/kit save [kit]</#f4d35e>"
