"scenarios.gui.scenario.sweep-the-floor.name": "<bold><#f4d35e>掃地板"
"scenarios.gui.scenario.sweep-the-floor.desc": "<#6b7280><i>礦物只能用刷子刷出來；玩家附近的沙子會變成藏有礦物的可疑的沙。</i>"
"scenario.sweep.brush-name": "<#f4d35e><bold>掃地刷</bold></#f4d35e>"
"scenario.sweep.start": "<prefix><#93c5fd>掃地板：礦物只能用刷子取得，對著礦物按住右鍵。你附近的沙子裡也藏著礦物。</#93c5fd>"
"scenario.sweep.use-brush": "<#f95738>礦物只能用刷子取得，對著它按住右鍵。</#f95738>"
"tutorial.stop.welcome.title": "<#f4d35e><bold>歡迎來到試煉UHC</bold></#f4d35e>"
"tutorial.stop.welcome.subtitle": "<#cbd5e1>快速導覽，按兩下潛行可離開</#cbd5e1>"
"tutorial.stop.welcome.text": "<prefix><#f4d35e><bold>歡迎來到試煉UHC</bold></#f4d35e><newline><#cbd5e1>這裡是大廳，每場比賽之間都在這裡等。帶你四處看看，大概一分半鐘。</#cbd5e1>"
"tutorial.stop.hotbar.title": "<#f4d35e><bold>你的快捷欄</bold></#f4d35e>"
"tutorial.stop.hotbar.subtitle": "<#cbd5e1>所有功能一鍵就到</#cbd5e1>"
"tutorial.stop.hotbar.text": "<prefix><#f4d35e><bold>你的快捷欄</bold></#f4d35e><newline><#cbd5e1>左邊是遊戲設定、情境和隊伍；右邊是個人檔案和排行榜。這個教學就是物品欄裡那支望遠鏡。<#93c5fd>/menu</#93c5fd> 打開快捷選單，<#93c5fd>/settings</#93c5fd> 是你的個人設定。</#cbd5e1>"
"tutorial.stop.parkour.title": "<#f4d35e><bold>跑酷</bold></#f4d35e>"
"tutorial.stop.parkour.subtitle": "<#cbd5e1>跑完全程，跟時間賽跑</#cbd5e1>"
"tutorial.stop.parkour.text": "<prefix><#f4d35e><bold>跑酷</bold></#f4d35e><newline><#cbd5e1>踩上起點的壓力板就開始，檢查點會幫你存進度。最佳成績會登上跑酷排行榜。<#93c5fd>/parkour</#93c5fd></#cbd5e1>"
"tutorial.stop.spleef.title": "<#f4d35e><bold>掘一死戰</bold></#f4d35e>"
"tutorial.stop.spleef.subtitle": "<#cbd5e1>把對手腳下的地板挖掉</#cbd5e1>"
"tutorial.stop.spleef.text": "<prefix><#f4d35e><bold>掘一死戰</bold></#f4d35e><newline><#cbd5e1>挖掉別人腳下的地板，最後還站著的人獲勝。用 <#93c5fd>/spleef</#93c5fd> 加入。</#cbd5e1>"
"tutorial.stop.tnt-run.title": "<#f4d35e><bold>TNT 跑跑</bold></#f4d35e>"
"tutorial.stop.tnt-run.subtitle": "<#cbd5e1>不要停下來</#cbd5e1>"
"tutorial.stop.tnt-run.text": "<prefix><#f4d35e><bold>TNT 跑跑</bold></#f4d35e><newline><#cbd5e1>你跑過的地板會消失，最後留在上面的人獲勝。用 <#93c5fd>/tntrun</#93c5fd> 加入。</#cbd5e1>"
"tutorial.stop.range.title": "<#f4d35e><bold>射擊場</bold></#f4d35e>"
"tutorial.stop.range.subtitle": "<#cbd5e1>先來練練弓</#cbd5e1>"
"tutorial.stop.range.text": "<prefix><#f4d35e><bold>射擊場</bold></#f4d35e><newline><#cbd5e1>時間到之前，射中冒出來的標靶就能得分。<#93c5fd>/range</#93c5fd></#cbd5e1>"
"tutorial.stop.leaderboards.title": "<#f4d35e><bold>排行榜</bold></#f4d35e>"
"tutorial.stop.leaderboards.subtitle": "<#cbd5e1>伺服器最強的玩家</#cbd5e1>"
"tutorial.stop.leaderboards.text": "<prefix><#f4d35e><bold>排行榜</bold></#f4d35e><newline><#cbd5e1>勝場、擊殺、K/D 都有，還分成總計、每月、每週和每日。點擊看板就能切換。<#93c5fd>/leaderboard</#93c5fd> <#93c5fd>/profile</#93c5fd></#cbd5e1>"
"tutorial.stop.podium.title": "<#f4d35e><bold>頒獎台</bold></#f4d35e>"
"tutorial.stop.podium.subtitle": "<#cbd5e1>贏家站上的地方</#cbd5e1>"
"tutorial.stop.podium.text": "<prefix><#f4d35e><bold>頒獎台</bold></#f4d35e><newline><#cbd5e1>每場比賽結束後，鏡頭會來到這裡：先頒發各項獎項，再讓前三名站上頒獎台。</#cbd5e1>"
"tutorial.stop.pvp.title": "<#f4d35e><bold>大廳 PvP 與練習場</bold></#f4d35e>"
"tutorial.stop.pvp.subtitle": "<#cbd5e1>等的時候也能打</#cbd5e1>"
"tutorial.stop.pvp.text": "<prefix><#f4d35e><bold>大廳 PvP 與練習場</bold></#f4d35e><newline><#cbd5e1>把快捷欄裡的劍拿在手上 3 秒，就能跟同樣開了 PvP 的人對打。<#93c5fd>/practice</#93c5fd> 會帶你到有完整套裝的練習場。</#cbd5e1>"
"tutorial.stop.teams.title": "<#f4d35e><bold>隊伍、投票與套裝</bold></#f4d35e>"
"tutorial.stop.teams.subtitle": "<#cbd5e1>為下一場比賽做準備</#cbd5e1>"
"tutorial.stop.teams.text": "<prefix><#f4d35e><bold>隊伍、投票與套裝</bold></#f4d35e><newline><#cbd5e1>用 <#93c5fd>/team</#93c5fd> 建立或加入隊伍，用 <#93c5fd>/vote</#93c5fd> 投票選下一場的情境，用 <#93c5fd>/kit</#93c5fd> 查看開場套裝。</#cbd5e1>"
"tutorial.stop.game-goal.title": "<#f4d35e><bold>比賽怎麼玩</bold></#f4d35e>"
"tutorial.stop.game-goal.subtitle": "<#cbd5e1>只有一條命，不會自然回血。</#cbd5e1>"
"tutorial.stop.game-goal.text": "<prefix><#f4d35e><bold>比賽怎麼玩</bold></#f4d35e><newline><#cbd5e1>UHC 就像極限模式：生命值不會自己回復，而且只有一條命。最後存活的玩家或隊伍獲勝。</#cbd5e1>"
"tutorial.stop.game-flow.title": "<#f4d35e><bold>傳送與和平時間</bold></#f4d35e>"
"tutorial.stop.game-flow.subtitle": "<#cbd5e1>前 10 分鐘不能 PvP</#cbd5e1>"
"tutorial.stop.game-flow.text": "<prefix><#f4d35e><bold>傳送與和平時間</bold></#f4d35e><newline><#cbd5e1>所有人會被分散到地圖各處。前 10 分鐘不能 PvP，趁機挖礦、收集資源、做裝備。第 10 分鐘所有人會回滿血一次。</#cbd5e1>"
"tutorial.stop.game-border.title": "<#f4d35e><bold>邊界與殊死戰</bold></#f4d35e>"
"tutorial.stop.game-border.subtitle": "<#cbd5e1>地圖會越來越小</#cbd5e1>"
"tutorial.stop.game-border.text": "<prefix><#f4d35e><bold>邊界與殊死戰</bold></#f4d35e><newline><#cbd5e1>從第 30 分鐘開始，邊界會往中心縮小。一小時後，剩下的人進入殊死戰一決勝負。</#cbd5e1>"
"tutorial.stop.game-healing.title": "<#f4d35e><bold>活下去</bold></#f4d35e>"
"tutorial.stop.game-healing.subtitle": "<#cbd5e1>金蘋果與金頭顱</#cbd5e1>"
"tutorial.stop.game-healing.text": "<prefix><#f4d35e><bold>活下去</bold></#f4d35e><newline><#cbd5e1>用金蘋果補血。被擊殺的玩家會掉落頭顱，用 8 個金錠圍住就能做出金頭顱。<#93c5fd>/recipe</#93c5fd></#cbd5e1>"
"tutorial.stop.game-after.title": "<#f4d35e><bold>陣亡之後</bold></#f4d35e>"
"tutorial.stop.game-after.subtitle": "<#cbd5e1>先旁觀，再來一場</#cbd5e1>"
"tutorial.stop.game-after.text": "<prefix><#f4d35e><bold>陣亡之後</bold></#f4d35e><newline><#cbd5e1>比賽結束前你都會是旁觀者，大廳在那之前是鎖住的。隨時可以再看一次：<#93c5fd>/tutorial rules</#93c5fd></#cbd5e1>"
"tutorial.book.1.title": "<#f4d35e><bold>目標</bold></#f4d35e>"
"tutorial.book.1.text": "<#cbd5e1>UHC 就像極限模式。你只有一條命，而且生命值不會自己回復，就算飢餓值是滿的也一樣。最後存活的玩家或隊伍獲勝。</#cbd5e1>"
"tutorial.book.2.title": "<#f4d35e><bold>加入與隊伍</bold></#f4d35e>"
"tutorial.book.2.text": "<#cbd5e1>比賽從大廳開始。打隊伍賽的話，用 /team 建立或加入隊伍；/tm 跟隊友聊天，/tc 分享座標。還沒有隊伍的人，比賽開始時會自動分隊。</#cbd5e1>"
"tutorial.book.3.title": "<#f4d35e><bold>傳送與和平時間</bold></#f4d35e>"
"tutorial.book.3.text": "<#cbd5e1>比賽一開始，大家會被傳送到彼此相隔很遠的地方。前 10 分鐘不能 PvP，先挖礦、收集資源、做裝備。這段時間也不能在其他隊伍附近放熔岩、火或 TNT。</#cbd5e1>"
"tutorial.book.4.title": "<#f4d35e><bold>最終回血與邊界</bold></#f4d35e>"
"tutorial.book.4.text": "<#cbd5e1>第 10 分鐘所有人會補滿血一次，這也是整場最後一次免費回血。從第 30 分鐘開始，邊界會往中心縮小，最後只剩 100 格寬；人在邊界外會被拉回來。</#cbd5e1>"
"tutorial.book.5.title": "<#f4d35e><bold>殊死戰</bold></#f4d35e>"
"tutorial.book.5.text": "<#cbd5e1>一小時後，還活著的人會被集中到封閉的方塊箱或決戰競技場，打到只剩一名玩家或一支隊伍為止。</#cbd5e1>"
"tutorial.book.6.title": "<#f4d35e><bold>補血</bold></#f4d35e>"
"tutorial.book.6.text": "<#cbd5e1>金蘋果是主要的補血方式：蘋果從樹上來，金子靠挖礦。被擊殺的玩家會掉落頭顱，在工作台用 8 個金錠圍住就能做出更強的金頭顱。/recipe 可以看伺服器的合成表。</#cbd5e1>"
"tutorial.book.7.title": "<#f4d35e><bold>情境與設定</bold></#f4d35e>"
"tutorial.book.7.text": "<#cbd5e1>情境會改變比賽規則：/scenarios 看目前開了哪些情境，/vote 投票決定下一場要玩哪些。/kit 看開場套裝，/config 看比賽設定。主持人可以調整這本書裡寫的時間。</#cbd5e1>"
"tutorial.book.8.title": "<#f4d35e><bold>淘汰之後</bold></#f4d35e>"
"tutorial.book.8.text": "<#cbd5e1>被淘汰後，你會當旁觀者到比賽結束，這段期間大廳是鎖住的；比賽途中才加入的玩家也一樣是旁觀者。你的勝場、擊殺和經驗都會記在 /profile 跟排行榜上。看規則：/rules，檢舉作弊：/report。</#cbd5e1>"
"tutorial.only-lobby": "只能在大廳、沒有比賽進行時觀看教學。"
"tutorial.busy": "請先離開你正在做的事（大廳小遊戲、練習場、旁觀或管理模式）。"
"tutorial.unavailable": "教學還不能用：還沒有設定大廳重生點。"
"tutorial.started": "<prefix><#cbd5e1>教學開始。按<white>兩下潛行</white>即可離開。</#cbd5e1>"
"tutorial.finished": "<prefix><#6dd3a0>導覽結束！</#6dd3a0><#cbd5e1>想慢慢看比賽怎麼玩：<click:run_command:'/tutorial rules'><hover:show_text:'/tutorial rules'><white><u>/tutorial rules</u></white></hover></click>。再看一次：/tutorial。</#cbd5e1>"
"tutorial.left": "<prefix><#cbd5e1>教學已結束。隨時可以用 <white>/tutorial</white> 再看一次。</#cbd5e1>"
"tutorial.match-start": "<prefix><#f4d35e>比賽即將開始，教學已結束。</#f4d35e>"
"tutorial.progress": "<#7b8aa0>教學 <white><current>/<total></white> · 按兩下潛行離開</#7b8aa0>"
"tutorial.skip-confirm": "<#f4d35e>再按一次潛行即可離開教學</#f4d35e>"
"tutorial.offer.title": "<#f4d35e><bold>歡迎來到試煉UHC！</bold></#f4d35e>"
"tutorial.offer.body": "<#cbd5e1>第一次來嗎？跟著鏡頭簡單導覽一下，帶你逛逛大廳，順便說明比賽怎麼玩（大約一分半鐘）。想離開隨時按兩下潛行。</#cbd5e1>"
"tutorial.offer.yes": "<#6dd3a0>帶我看看</#6dd3a0>"
"tutorial.offer.later": "<#7b8aa0>以後再說</#7b8aa0>"
"tutorial.offer.later-hint": "<prefix><#cbd5e1>沒問題，隨時可以用 <white>/tutorial</white> 或物品欄裡的望遠鏡觀看。</#cbd5e1>"
"tutorial.book.title": "<#f4d35e><bold>如何遊玩</bold></#f4d35e> <#7b8aa0>（<page>/<pages>）</#7b8aa0>"
"tutorial.book.close": "關閉"
"tutorial.book.back": "◀ 上一頁"
"tutorial.book.next": "下一頁 ▶"
"tutorial.book.done": "完成"
"tutorial.admin.usage": "<#f4d35e><bold>/admin tutorial</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin tutorial point <站點></#93c5fd> <#7b8aa0>- 在你站的位置、朝你看的方向加一個鏡頭點；鏡頭會依序飛過這些點</#7b8aa0><newline> <#93c5fd>/admin tutorial record <站點></#93c5fd> <#7b8aa0>- 即時錄製鏡頭：自己飛一次，再輸入 record 結束</#7b8aa0><newline> <#93c5fd>/admin tutorial setstop <站點></#93c5fd> <#7b8aa0>- 從這裡重新開始這個站點的路徑</#7b8aa0><newline> <#93c5fd>/admin tutorial clearstop <站點></#93c5fd> <#7b8aa0>- 改回繞著系統本身的位置</#7b8aa0><newline> <#93c5fd>/admin tutorial stops</#93c5fd> <#7b8aa0>- 所有站點與鏡頭</#7b8aa0><newline> <#93c5fd>/admin tutorial test [站點]</#93c5fd> <#7b8aa0>- 自己看一次（或只看一站）</#7b8aa0>"
