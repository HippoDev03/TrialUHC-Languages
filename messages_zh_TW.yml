    root: "<prefix><#f4d35e>使用方法: /uhc <pause|resume|start|forcestart|stop|state|setlobby|skipGracePeriod|skipphase|reload|checkready|reset|gen [world] [terrain=normal|flat|amplified|large_biomes|void] [biome=PLAINS] [generator=Plugin:gen] [hardcore=false] [seed=123]|preloadworld [radius]|kill <player|selector>|level [player]|papi|recipes|revive <player>></#f4d35e>"
