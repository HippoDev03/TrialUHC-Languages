    create: "<#f4d35e><bold>/clan create</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/clan create <名稱> <標籤></#93c5fd> <#7b8aa0>- 名稱可以有空格；最後一個詞是標籤（2-5 個字元）</#7b8aa0>"
