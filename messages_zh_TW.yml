config-menu-desc-rules-kick-on-death: "玩家被淘汰時立即踢出伺服器。"
config-menu-desc-rules-drop-head-on-kill: "被擊殺的玩家會掉落頭顱，可用來合成金頭顱。"
config-menu-desc-teams-enabled: "啟用隊伍模式，玩家會被分成隊伍並一起爭取勝利。"
config-menu-desc-teams-max-size: "每隊最多可以有幾名玩家。"
config-menu-desc-teams-friendly-fire: "隊友之間是否可以互相造成傷害。"
config-menu-desc-teams-teammate-glow: "用隔牆可見的發光外框標出隊友。"
config-menu-desc-teams-teammate-locator-bar: "在你的定位條上以隊伍顏色顯示隊友，敵人永遠看不到你。"
config-menu-desc-teams-allow-lobby-switch: "允許玩家在大廳自由更換隊伍。"
config-menu-desc-teams-auto-balance-on-start: "比賽開始時自動移動玩家，讓各隊人數平均。"
config-menu-desc-teams-show-teammates-in-lobby: "在大廳中讓所有隊員互相看得見。"
config-menu-desc-teams-show-teammates-in-game: "在比賽中讓所有隊員互相看得見。"
config-menu-desc-teams-voice-chat-enabled: "啟用 SocketSVC 整合，提供隊伍專屬的語音頻道。"
config-menu-desc-teams-voice-chat-global-lobby: "為大廳中的所有玩家建立一個共用的全域語音頻道。"
config-menu-desc-teams-voice-chat-team-groups-in-game: "比賽中為每個隊伍建立各自的語音頻道。"
