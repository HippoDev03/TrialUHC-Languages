      - "<#cbd5e1>切換大廳玩家可見性。</#cbd5e1>"
      - "<#7b8aa0>隱藏其他玩家以獲得更乾淨的視野。</#7b8aa0>"
  recipes:
    name: "<#f4d35e><bold>UHC 配方</bold></#f4d35e>"
    lore:
      - "<#cbd5e1>開啟自訂 UHC 配方檢視器。</#cbd5e1>"
      - "<#7b8aa0>查看金頭顱等自訂合成。</#7b8aa0>"
  pvp_sword:
    name: "<#f95738><bold>大廳 PvP</bold></#f95738>"
    lore:
      - "<#cbd5e1>拿著此劍 3 秒。</#cbd5e1>"
      - "<#7b8aa0>這會啟用你自己的大廳 PvP。</#7b8aa0>"
      - "<#93c5fd>右鍵點擊以進入練習競技場。</#93c5fd>"
  stats:
    name: "<#f4d35e><bold>個人資料</bold></#f4d35e>"
    lore:
      - "<#cbd5e1>開啟你的玩家資料。</#cbd5e1>"
      - "<#7b8aa0>顯示你的資料、等級與統計。</#7b8aa0>"
  language:
    name: "<#93c5fd><bold>語言</bold></#93c5fd>"
    lore:
      - "<#cbd5e1>開啟語言選擇 GUI。</#cbd5e1>"
      - "<#7b8aa0>選擇你的語系。</#7b8aa0>"
  kit_selector:
    name: "<#93c5fd><bold>套裝選擇</bold></#93c5fd>"
    lore:
      - "<#cbd5e1>預覽你的開局物品欄。</#cbd5e1>"
      - "<#7b8aa0>在開局前選擇你要使用的套裝。</#7b8aa0>"
  config:
    name: "<#6dd3a0><bold>遊戲設定</bold></#6dd3a0>"
    lore:
      - "<#cbd5e1>開啟設定檢視器。</#cbd5e1>"
      - "<#7b8aa0>管理員可直接編輯數值。</#7b8aa0>"
  leaderboard:
    name: "<#6dd3a0><bold>排行榜</bold></#6dd3a0>"
    lore:
      - "<#cbd5e1>顯示頂尖玩家或排名。</#cbd5e1>"
      - "<#7b8aa0>開啟排行榜檢視器。</#7b8aa0>"
  team_selector:
    name: "<#7dd3fc><bold>隊伍</bold></#7dd3fc>"
    lore:
      - "<#cbd5e1>開啟隊伍選擇器。</#cbd5e1>"
      - "<#7b8aa0>在比賽開始前加入或離開隊伍。</#7b8aa0>"
  lobby_spectator:
    name: "<#9db4c0><bold>觀戰比賽</bold></#9db4c0>"
