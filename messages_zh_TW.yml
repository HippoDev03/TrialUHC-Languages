    join: "<#f4d35e><bold>/team join</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/team join <隊伍></#93c5fd> <#7b8aa0>- 加入公開隊伍</#7b8aa0>"
    create: "<#f4d35e><bold>/team create</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/team create [名稱]</#93c5fd> <#7b8aa0>- 建立隊伍（名稱可不填）</#7b8aa0>"
    delete: "<#f4d35e><bold>/admin team delete</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team delete <隊伍></#93c5fd> <#7b8aa0>- 刪除隊伍</#7b8aa0>"
    set: "<#f4d35e><bold>/admin team set</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team set <玩家> <隊伍></#93c5fd> <#7b8aa0>- 將玩家加入隊伍</#7b8aa0>"
    rename: "<#f4d35e><bold>/admin team rename</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team rename <隊伍> <顯示名稱></#93c5fd> <#7b8aa0>- 重新命名隊伍</#7b8aa0>"
    color: "<#f4d35e><bold>/admin team color</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team color <隊伍> <顏色></#93c5fd> <#7b8aa0>- 變更隊伍顏色</#7b8aa0>"
    size: "<#f4d35e><bold>/admin team size</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team size <大小></#93c5fd> <#7b8aa0>- 每隊人數</#7b8aa0>"
    transfer: "<#f4d35e><bold>/team transfer</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/team transfer <玩家></#93c5fd> <#7b8aa0>- 將隊長轉移給其他人</#7b8aa0>"
    kick: "<#f4d35e><bold>/team kick</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/team kick <玩家></#93c5fd> <#7b8aa0>- 將玩家移出隊伍</#7b8aa0>"
