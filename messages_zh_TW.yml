"scenario.lafs.teams-off": "<#f95738>LAFS 需要開啟隊伍模式。</#f95738>"
"scenario.lafs.sent": "<prefix><#93c5fd>已邀請 <white><player></white> 組隊，對方對你按右鍵就會接受。</#93c5fd>"
