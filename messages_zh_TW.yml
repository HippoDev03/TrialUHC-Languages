"scenario.moles.you": "<prefix><#8b5a2b>你是<bold>臥底</bold>：只剩臥底時，你和其他臥底一起獲勝。你可以攻擊自己的隊友。</#8b5a2b><white>/mole <訊息></white><#7b8aa0> 和臥底說話，</#7b8aa0><white>/mole</white><#7b8aa0> 列出臥底。</#7b8aa0>"
"scenario.moles.among-you": "<prefix><#8b5a2b>每個隊伍裡都有一名臥底，誰都別相信。</#8b5a2b>"
