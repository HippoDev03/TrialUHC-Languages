# Command usage
usage:
  uhc:
    root: "<#f4d35e><bold>/uhc</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/uhc help [頁數]</#93c5fd> <#7b8aa0>- 所有你可以使用的指令</#7b8aa0><newline> <#93c5fd>/uhc level [玩家]</#93c5fd> <#7b8aa0>- 等級與經驗</#7b8aa0><newline> <#93c5fd>/uhc recipes</#93c5fd> <#7b8aa0>- 自訂合成表</#7b8aa0><newline> <#93c5fd>/uhc docs</#93c5fd> <#7b8aa0>- 遊戲內指南</#7b8aa0><newline> <#64748b>管理工具：/admin · 管理員工具：/staff help</#64748b>"
    kill: "<#f4d35e><bold>/kill</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/kill <玩家|選擇器></#93c5fd> <#7b8aa0>- 淘汰玩家（* = 所有存活玩家）</#7b8aa0>"
    level: "<#f4d35e><bold>/uhc level</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/uhc level [玩家]</#93c5fd> <#7b8aa0>- 查看等級、經驗與升級進度</#7b8aa0>"
    experience: "<#f4d35e><bold>/admin experience</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin experience <玩家|名稱模式> set <數量></#93c5fd> <#7b8aa0>- 設定總經驗</#7b8aa0><newline> <#93c5fd>/admin experience <玩家|名稱模式> add|remove <數量></#93c5fd> <#7b8aa0>- 增加或減少經驗</#7b8aa0><newline> <#93c5fd>/admin experience <玩家|名稱模式> setlevel <等級></#93c5fd> <#7b8aa0>- 直接設定等級</#7b8aa0><newline> <#64748b>100 經驗 = 1 級 · * 代表任意字元，例如 HippoDev_*</#64748b>"
    revive: "<#f4d35e><bold>/revive</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/revive <玩家></#93c5fd> <#7b8aa0>- 復活被淘汰的玩家</#7b8aa0>"
    lobbygame: "<#f4d35e><bold>/admin lobbygame</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin lobbygame start <game></#93c5fd> <#7b8aa0>- math、unscramble、type、trivia、number、reaction、treasure、potato</#7b8aa0><newline> <#93c5fd>/admin lobbygame stop</#93c5fd> <#7b8aa0>- 停止進行中的遊戲</#7b8aa0><newline> <#93c5fd>/admin lobbygame word <add|remove|list> [單字]</#93c5fd> <#7b8aa0>- 編輯重組單字清單</#7b8aa0><newline> <#93c5fd>/admin lobbygame parkour <setstart|addcheckpoint|removecheckpoint|setfinish|clear|resettimes|top></#93c5fd> <#7b8aa0>- 設定跑酷</#7b8aa0><newline> <#93c5fd>/admin lobbygame range <setlane|removelane|addstray|removestray|addtarget|removetarget|area1|area2|cleararea|list|top> [靶道]</#93c5fd> <#7b8aa0>- 設定靶場</#7b8aa0>"
    pm: "<#f4d35e><bold>/msg</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/msg <玩家> <訊息></#93c5fd> <#7b8aa0>- 傳送私人訊息</#7b8aa0>"
    reply: "<#f4d35e><bold>/r</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/r <訊息></#93c5fd> <#7b8aa0>- 回覆最後一則私人訊息</#7b8aa0>"
    profile: "<#f4d35e><bold>/profile</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/profile [玩家]</#93c5fd> <#7b8aa0>- 查看個人資料</#7b8aa0><newline> <#93c5fd>/profile list [頁數]</#93c5fd> <#7b8aa0>- 列出已儲存的個人資料</#7b8aa0>"
    world:
      root: "<#f4d35e><bold>/world</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world list | current</#93c5fd> <#7b8aa0>- 列出世界／查看比賽世界</#7b8aa0><newline> <#93c5fd>/world gen [世界]</#93c5fd> <#7b8aa0>- 生成比賽世界</#7b8aa0><newline> <#93c5fd>/world load|unload <世界></#93c5fd> <#7b8aa0>- 載入或卸載世界</#7b8aa0><newline> <#93c5fd>/world select <世界></#93c5fd> <#7b8aa0>- 設為比賽世界</#7b8aa0><newline> <#93c5fd>/world tp [世界]</#93c5fd> <#7b8aa0>- 傳送到世界</#7b8aa0><newline> <#93c5fd>/world preload [世界] [半徑]</#93c5fd> <#7b8aa0>- 使用 Chunky 預先生成</#7b8aa0><newline> <#93c5fd>/world regen [世界] | delete <世界></#93c5fd> <#7b8aa0>- 重新生成／刪除世界</#7b8aa0><newline> <#93c5fd>/world seed save [名稱] | list | remove <名稱></#93c5fd> <#7b8aa0>- 儲存比賽世界的種子／已存種子</#7b8aa0><newline> <#93c5fd>/world clean</#93c5fd> <#7b8aa0>- 刪除所有生成的 uhc_ 世界</#7b8aa0>"
      load: "<#f4d35e><bold>/world load</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world load <世界></#93c5fd> <#7b8aa0>- 載入世界資料夾</#7b8aa0>"
      unload: "<#f4d35e><bold>/world unload</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world unload <世界></#93c5fd> <#7b8aa0>- 卸載世界</#7b8aa0>"
      tp: "<#f4d35e><bold>/world tp</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world tp [世界]</#93c5fd> <#7b8aa0>- 傳送到世界（預設為比賽世界）</#7b8aa0>"
      preload: "<#f4d35e><bold>/world preload</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world preload [世界] [半徑]</#93c5fd> <#7b8aa0>- 使用 Chunky 預先生成</#7b8aa0>"
      seed: "<#f4d35e><bold>/world seed</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/world seed save [名稱]</#93c5fd> <#7b8aa0>- 儲存比賽世界（或預覽中世界）的種子</#7b8aa0><newline> <#93c5fd>/world seed list</#93c5fd> <#7b8aa0>- 已存的種子（點擊即可生成）</#7b8aa0><newline> <#93c5fd>/world seed remove <名稱></#93c5fd> <#7b8aa0>- 刪除已存的種子</#7b8aa0><newline> <#64748b>使用 /admin gen seed=<名稱> 生成，或 seed=saved 隨機挑一個已存種子。</#64748b>"
    border: "<#f4d35e><bold>/admin border</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin border info</#93c5fd> <#7b8aa0>- 目前大小與中心</#7b8aa0><newline> <#93c5fd>/admin border set <大小></#93c5fd> <#7b8aa0>- 立即設定大小</#7b8aa0><newline> <#93c5fd>/admin border center <x> <z></#93c5fd> <#7b8aa0>- 移動中心</#7b8aa0><newline> <#93c5fd>/admin border shrink <大小> <秒數></#93c5fd> <#7b8aa0>- 在指定時間內縮小</#7b8aa0><newline> <#93c5fd>/admin border reset</#93c5fd> <#7b8aa0>- 恢復為設定的大小</#7b8aa0>"
    announce: "<#f4d35e><bold>/staff announce</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/staff announce <訊息></#93c5fd> <#7b8aa0>- 向所有人發送大型公告</#7b8aa0><newline> <#64748b>| = 換行 · [en] … [zh_tw] … 依玩家語言顯示</#64748b>"
    heal: "<#f4d35e><bold>/heal</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/heal [玩家]</#93c5fd> <#7b8aa0>- 回滿血量與飽食度（* = 所有人）</#7b8aa0>"
    freeze: "<#f4d35e><bold>/staff freeze</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/staff freeze <玩家></#93c5fd> <#7b8aa0>- 讓玩家無法移動（* = 所有人）</#7b8aa0>"
    unfreeze: "<#f4d35e><bold>/staff unfreeze</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/staff unfreeze <玩家></#93c5fd> <#7b8aa0>- 解除玩家凍結</#7b8aa0>"
    preloadworld: "<#f4d35e><bold>/admin preloadworld</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin preloadworld [半徑]</#93c5fd> <#7b8aa0>- 預先生成比賽世界</#7b8aa0><newline> <#93c5fd>/admin preloadworld status | stop</#93c5fd> <#7b8aa0>- 進度／停止預先生成</#7b8aa0>"
    language: "<#f4d35e><bold>/language</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/language</#93c5fd> <#7b8aa0>- 開啟語言選單</#7b8aa0><newline> <#93c5fd>/language <locale|auto></#93c5fd> <#7b8aa0>- 選擇語言，或跟隨遊戲語言</#7b8aa0>"
    gen: "<#f4d35e><bold>/admin gen</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin gen</#93c5fd> <#7b8aa0>- 生成並預覽新世界</#7b8aa0><newline> <#93c5fd>/admin gen <世界></#93c5fd> <#7b8aa0>- 直接以此名稱生成世界</#7b8aa0><newline> <#93c5fd>terrain=normal|flat|amplified|large_biomes|void</#93c5fd> <#7b8aa0>- 地形類型</#7b8aa0><newline> <#93c5fd>biome=<biome> · seed=<number|name|saved></#93c5fd> <#7b8aa0>- 單一生態域／固定種子</#7b8aa0><newline> <#93c5fd>structures=true|false · hardcore=true|false</#93c5fd> <#7b8aa0>- 結構／極限模式</#7b8aa0><newline> <#93c5fd>pack=uhc · generator=Plugin:id · biome-provider=Plugin:id · generator-settings=<data></#93c5fd> <#7b8aa0>- 資料包／自訂生成器</#7b8aa0>"
    report: "<#f4d35e><bold>/report</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/report <玩家> <原因></#93c5fd> <#7b8aa0>- 向管理員檢舉玩家</#7b8aa0>"
    kit:
      create: "<#f4d35e><bold>/kit create</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/kit create <套裝></#93c5fd> <#7b8aa0>- 以目前背包建立套裝</#7b8aa0>"
      edit: "<#f4d35e><bold>/kit edit</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/kit edit <套裝></#93c5fd> <#7b8aa0>- 將套裝載入背包以編輯</#7b8aa0>"
      save: "<#f4d35e><bold>/kit save</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/kit save [套裝]</#93c5fd> <#7b8aa0>- 儲存正在編輯的套裝</#7b8aa0>"
    invsee: "<#f4d35e><bold>/staff invsee</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/staff invsee <玩家></#93c5fd> <#7b8aa0>- 開啟玩家的背包</#7b8aa0>"
    reboot: "<#f4d35e><bold>/admin reboot</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin reboot <時間></#93c5fd> <#7b8aa0>- 倒數後重新啟動：30s、5m、1h、1m30s（只寫數字 = 分鐘）</#7b8aa0><newline> <#93c5fd>/admin reboot cancel</#93c5fd> <#7b8aa0>- 取消重新啟動</#7b8aa0>"
    namehistory: "<#f4d35e><bold>/admin namehistory</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin namehistory <名稱></#93c5fd> <#7b8aa0>- 查看玩家用過的所有名稱（可輸入目前或舊的名稱）</#7b8aa0>"
  team:
    root: "<#f4d35e><bold>/team</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/team</#93c5fd> <#7b8aa0>- 開啟隊伍選單</#7b8aa0><newline> <#93c5fd>/team list | join <隊伍> | leave</#93c5fd> <#7b8aa0>- 瀏覽、加入或離開隊伍</#7b8aa0><newline> <#93c5fd>/team create [名稱]</#93c5fd> <#7b8aa0>- 建立自己的隊伍</#7b8aa0><newline> <#93c5fd>/team invite <玩家></#93c5fd> <#7b8aa0>- 邀請玩家（隊長）</#7b8aa0><newline> <#93c5fd>/team rename <顯示名稱> | color <顏色></#93c5fd> <#7b8aa0>- 修改隊伍外觀（隊長）</#7b8aa0><newline> <#93c5fd>/team public | private</#93c5fd> <#7b8aa0>- 設定誰可以加入（隊長）</#7b8aa0><newline> <#93c5fd>/team transfer <玩家> | kick <玩家> | disband</#93c5fd> <#7b8aa0>- 管理隊伍（隊長）</#7b8aa0><newline> <#93c5fd>/team chat</#93c5fd> <#7b8aa0>- 切換隊伍聊天（或 /tm）</#7b8aa0>"
    join: "<#f4d35e><bold>/team join</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/team join <隊伍></#93c5fd> <#7b8aa0>- 加入公開隊伍</#7b8aa0>"
    create: "<#f4d35e><bold>/team create</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/team create [名稱]</#93c5fd> <#7b8aa0>- 建立隊伍（名稱可不填）</#7b8aa0>"
    delete: "<#f4d35e><bold>/admin team delete</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team delete <隊伍></#93c5fd> <#7b8aa0>- 刪除隊伍</#7b8aa0>"
    set: "<#f4d35e><bold>/admin team set</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team set <玩家> <隊伍></#93c5fd> <#7b8aa0>- 將玩家加入隊伍</#7b8aa0>"
    rename: "<#f4d35e><bold>/admin team rename</bold></#f4d35e> <#7b8aa0>用法：</#7b8aa0><newline> <#93c5fd>/admin team rename <隊伍> <顯示名稱></#93c5fd> <#7b8aa0>- 重新命名隊伍</#7b8aa0>"
